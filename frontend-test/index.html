<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Finance Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finance Lab">
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-top: env(safe-area-inset-top, 0px); }
        body { background: #050505; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; transition: background-color 0.3s ease, color 0.3s ease; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
        .glass-card { background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; transition: background-color 0.3s ease; }
        .accent-glow { color: #5dbd8c; text-shadow: 0 0 8px rgba(45, 212, 191, 0.3); }
        input, select { background: #111 !important; border: 1px solid #222 !important; color: white !important; }
        input:focus, select:focus { border-color: #5dbd8c !important; outline: none; }
        .pie-chart { border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { height: 6px; border-radius: 3px; background: #1f1f1f; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.5s ease; }
        
        /* ── Responsive / Mobile ── */
        @media (max-width: 768px) {
            .hide-mobile { display: none !important; }
            .glass-card { border-radius: 6px; }
            input, select, button { font-size: 16px !important; }
            .grid-cols-2, .md\:grid-cols-2 { grid-template-columns: 1fr !important; }
            .grid-cols-3, .md\:grid-cols-3 { grid-template-columns: 1fr !important; }
            .grid-cols-4, .md\:grid-cols-4 { grid-template-columns: 1fr 1fr !important; }
            table { font-size: 9px !important; }
            th, td { padding: 0.35rem 0.2rem !important; }
            .p-6, .p-8, .md\:p-8 { padding: 0.75rem !important; }
            .text-2xl { font-size: 1.1rem !important; }
            .text-lg { font-size: 0.9rem !important; }
            .max-w-2xl { max-width: 100% !important; }
            .mb-8 { margin-bottom: 0.75rem !important; }
            .gap-4 { gap: 0.35rem !important; }
            .space-y-4 > * + * { margin-top: 0.5rem !important; }
            .space-y-6 > * + * { margin-top: 0.75rem !important; }
            nav button { padding: 0.4rem 0.6rem !important; font-size: 8px !important; }
            header { flex-direction: column !important; gap: 0.5rem !important; padding-bottom: 0.5rem !important; }
            .text-\[9px\], .text-\[10px\], .text-\[11px\] { font-size: 8px !important; }
            .text-\[13px\] { font-size: 10px !important; }
            .text-sm { font-size: 0.7rem !important; }
            .px-4 { padding-left: 0.5rem !important; padding-right: 0.5rem !important; }
            .py-2 { padding-top: 0.35rem !important; padding-bottom: 0.35rem !important; }
            h2 { font-size: 0.8rem !important; }
            .w-10, .h-10 { width: 2rem !important; height: 2rem !important; }
            .w-5, .h-5 { width: 1rem !important; height: 1rem !important; }
            svg.w-5 { width: 1rem !important; height: 1rem !important; }
        }
        
        /* PWA standalone: compact nav */
        @media all and (display-mode: standalone) {
            .pwa-compact { padding: 0.25rem 0.5rem !important; font-size: 9px !important; }
            .pwa-compact button { padding: 0.3rem 0.5rem !important; font-size: 8px !important; }
            .hide-standalone { display: none !important; }
        }
        
        body.light-mode { background: #f8fafc; color: #0f172a; }
        body.light-mode .glass-card { background: #ffffff; border-color: #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        body.light-mode .bg-zinc-900, body.light-mode .bg-black, body.light-mode .bg-zinc-800 { background-color: #f1f5f9 !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        body.light-mode .bg-zinc-900\/50 { background-color: #f8fafc !important; }
        body.light-mode .text-zinc-500, body.light-mode .text-zinc-400, body.light-mode .text-zinc-600 { color: #64748b !important; }
        body.light-mode .text-zinc-300, body.light-mode .text-zinc-200, body.light-mode .text-white { color: #0f172a !important; }
        body.light-mode .border-zinc-800, body.light-mode .border-zinc-700 { border-color: #e2e8f0 !important; }
        body.light-mode input, body.light-mode select { background: #ffffff !important; border: 1px solid #cbd5e1 !important; color: #0f172a !important; }
        body.light-mode .divide-zinc-900 > :not([hidden]) ~ :not([hidden]) { border-color: #e2e8f0 !important; }
        body.light-mode .hover\:bg-zinc-900\/50:hover, body.light-mode .focus-within\:bg-zinc-900\/50:focus-within { background-color: #e2e8f0 !important; }
        
        /* ── Navigation Drawer (Bluecoins style) ── */
        .drawer-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }
        
        .drawer-panel {
            position: fixed; top: 0; left: 0; z-index: 101; width: 280px; max-width: 85vw; height: 100%; height: 100dvh;
            background: #0d0d0d; border-right: 1px solid #1f1f1f;
            transform: translateX(-100%); transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px);
            box-shadow: 4px 0 24px rgba(0,0,0,0.5);
        }
        .drawer-panel.open { transform: translateX(0); }
        
        .drawer-header {
            padding: 1.25rem 1rem 1rem;
            border-bottom: 1px solid #1f1f1f;
            background: linear-gradient(135deg, #0d2b1f 0%, #0d0d0d 60%);
        }
        .drawer-header h2 { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; color: #e2e8f0; }
        .drawer-header .sub { font-size: 0.6rem; color: #3d8068; text-transform: uppercase; letter-spacing: 0.2em; margin-top: 2px; }
        .drawer-user { font-size: 0.65rem; color: #5dbd8c; margin-top: 8px; text-transform: uppercase; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .drawer-user-dot { width: 7px; height: 7px; border-radius: 50%; background: #5dbd8c; box-shadow: 0 0 6px rgba(93,189,140,0.5); }
        
        .drawer-section { padding: 0.5rem 0; }
        .drawer-section-title { padding: 0.3rem 1rem; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.15em; color: #555; font-weight: 700; }
        
        .drawer-item {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1rem;
            font-size: 0.75rem; font-weight: 600; color: #999; cursor: pointer;
            transition: all 0.15s ease; border-left: 3px solid transparent;
            letter-spacing: 0.02em; text-decoration: none;
        }
        .drawer-item:hover, .drawer-item:active { background: #111; color: #e2e8f0; }
        .drawer-item.active { color: #5dbd8c; background: #0a1a14; border-left-color: #3d8068; }
        .drawer-item svg { width: 1.15rem; height: 1.15rem; flex-shrink: 0; opacity: 0.7; }
        .drawer-item.active svg { opacity: 1; }
        .drawer-item .badge { margin-left: auto; font-size: 0.55rem; background: #3d8068; color: #000; padding: 2px 6px; border-radius: 10px; font-weight: 800; }
        
        .drawer-divider { height: 1px; background: #1a1a1a; margin: 0.25rem 0.75rem; }
        
        body.light-mode .drawer-panel { background: #f8fafc; border-right-color: #e2e8f0; }
        body.light-mode .drawer-overlay { background: rgba(0,0,0,0.3); }
        body.light-mode .drawer-header { background: linear-gradient(135deg, #d4ede3 0%, #f8fafc 60%); }
        body.light-mode .drawer-header h2 { color: #0f172a; }
        body.light-mode .drawer-header .sub { color: #3d8068; }
        body.light-mode .drawer-item { color: #64748b; }
        body.light-mode .drawer-item:hover, body.light-mode .drawer-item:active { background: #f1f5f9; color: #0f172a; }
        body.light-mode .drawer-item.active { color: #3d8068; background: #dcfce7; border-left-color: #3d8068; }
        body.light-mode .drawer-divider { background: #e2e8f0; }
        
        /* ── Scrollbar sutil ── */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1f1f1f; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #333; }
        body.light-mode .custom-scroll::-webkit-scrollbar-thumb { background: #d1d5db; }
        body.light-mode .custom-scroll::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        /* ── Donut center adaptativo ── */
        .donut-center { fill: #0a0a0a; stroke: #1a1a1a; }
        body.light-mode .donut-center { fill: #ffffff; stroke: #e2e8f0; }
        /* Donut text: blanco en dark, oscuro en light */
        .donut-text { fill: #ffffff; }
        body.light-mode .donut-text { fill: #0f172a; }
        
        /* ── TDC bar track adaptativo ── */
        .bar-track { background: #111; }
        body.light-mode .bar-track { background: #e2e8f0; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>/* SW disabled */</script>
    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef, useDeferredValue } = React;

        const API_URL = "/financelab/api";

        // ── UTILITIES ──
        const parseFechaTS = (s) => { if(!s) return 0; const p=s.split('/'); return new Date(+p[2],+p[1]-1,+p[0]).getTime(); };
        const apiCall = async (action, payload = null) => {
            try {
                const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
                const d = JSON.parse(await r.text());
                if (!d.success) throw new Error(d.error);
                return d.data;
            } catch(e) { throw new Error(e.message||"Error del Servidor."); }
        };
        const enriquecerLogs = (logs) => logs.map(l => ({...l, _sortTS: parseFechaTS(l.Fecha_Compra), _regTS: parseFechaTS(l.Fecha_Registro?.split(' ')[0]) }));
        const COLORES_PASTEL = ['#5dbd8c','#0ea5e9','#8b5cf6','#f43f5e','#f59e0b','#10b981','#3b82f6','#ec4899','#3d8068','#6366f1'];
        const getHoyStr = () => new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().split('T')[0];
        const formatoMoneda = (num) => Number(num||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2});
        const useDebounce = (value, delay=250) => { const [debounced,setDebounced]=useState(value); useEffect(()=>{const t=setTimeout(()=>setDebounced(value),delay);return ()=>clearTimeout(t);},[value,delay]); return debounced; };

        const IconEdit = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>;
        const IconDelete = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>;
        const IconSun = () => <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const IconMoon = () => <svg className="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>;
        const IconGear = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconLaunch = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>;
        const IconCheck = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>;
        const IconClose = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconWarn = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
        const IconSearch = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const IconLock = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>;
        const IconSave = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        const IconArrowRight = () => <svg className="w-3 h-3 inline" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
        
        // ── DRAWER ICONS ──
        const IconHamburger = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
        const IconHome = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const IconCalendar = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
        const IconWallet = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 010-4h14v4"/><path d="M3 5v14a2 2 0 002 2h16v-5"/><path d="M18 12a2 2 0 000 4h0a2 2 0 000-4z"/></svg>;
        const IconTag = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>;
        const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const IconPieChart = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg>;
        const IconChevronLeft = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>;

        // === PERIOD SELECTOR (compartido) ===
        const PeriodSelector = ({ periodos, periodoActivo, setPeriodoActivo, getPeriodoActual, label }) => {
            const [open, setOpen] = useState(false);
            const [showMorePast, setShowMorePast] = useState(false);
            const [showMoreFuture, setShowMoreFuture] = useState(false);
            const [showPicker, setShowPicker] = useState(false);
            const [pickMonth, setPickMonth] = useState(new Date().getMonth() + 1);
            const [pickYear, setPickYear] = useState(new Date().getFullYear());
            const [openMonthDrop, setOpenMonthDrop] = useState(false);
            const [openYearDrop, setOpenYearDrop] = useState(false);
            const ref = useRef(null);
            const monthRef = useRef(null);
            const yearRef = useRef(null);
            
            useEffect(() => {
                const h = (e) => {
                    if (ref.current && !ref.current.contains(e.target)) { setOpen(false); setShowPicker(false); }
                };
                if (open) document.addEventListener('mousedown', h);
                return () => document.removeEventListener('mousedown', h);
            }, [open]);
            // Cerrar dropdowns de mes/año al click fuera
            useEffect(() => {
                const h = (e) => {
                    if (monthRef.current && !monthRef.current.contains(e.target)) setOpenMonthDrop(false);
                    if (yearRef.current && !yearRef.current.contains(e.target)) setOpenYearDrop(false);
                };
                document.addEventListener('mousedown', h);
                return () => document.removeEventListener('mousedown', h);
            }, []);
            
            const parseP = (p) => { const [d,m,y] = p.split('/').map(Number); return new Date(y, m-1, d); };
            const actual = getPeriodoActual();
            const fechaActual = parseP(actual);
            const idxActual = periodos.indexOf(periodoActivo);
            
            // Dividir en pasados (< hoy), presente (= hoy), futuros (> hoy)
            const pasados = periodos.filter(p => parseP(p) < fechaActual);
            const presente = periodos.filter(p => p === actual);
            const futuros = periodos.filter(p => parseP(p) > fechaActual);
            
            const DEFAULT_WINDOW = 4;
            const pastSlice = showMorePast ? pasados : pasados.slice(Math.max(0, pasados.length - DEFAULT_WINDOW));
            const futureSlice = showMoreFuture ? futuros : futuros.slice(0, DEFAULT_WINDOW);
            const hiddenPastCount = pasados.length - pastSlice.length;
            const hiddenFutureCount = futuros.length - futureSlice.length;

            const buscarPeriodo = (mes, año) => {
                const ultimoDia = new Date(año, mes, 0).getDate();
                const target = `${String(ultimoDia).padStart(2,'0')}/${String(mes).padStart(2,'0')}/${año}`;
                if (periodos.includes(target)) return target;
                const found = periodos.find(p => {
                    const [,m,y] = p.split('/').map(Number);
                    return m === mes && y === año;
                });
                return found || target;
            };

            const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            const añoMin = Math.min(new Date().getFullYear() - 3, ...periodos.map(p => parseInt(p.split('/')[2]) || 9999));
            const añoMax = Math.max(new Date().getFullYear() + 3, ...periodos.map(p => parseInt(p.split('/')[2]) || 0));
            const años = Array.from({length: añoMax - añoMin + 1}, (_,i) => añoMin + i);

            return (
                <div className="relative" ref={ref}>
                    <button onClick={() => setOpen(!open)} className="flex items-center gap-1.5 px-2.5 py-1.5 bg-zinc-900 border border-zinc-800 rounded-lg hover:border-zinc-700 transition-colors group">
                        <span className="text-[11px] text-zinc-400 font-medium whitespace-nowrap">{label || 'Corte'}</span>
                        <span className="text-[12px] text-[#5dbd8c] font-bold font-mono">{periodoActivo}</span>
                        <svg className={`w-3 h-3 text-zinc-500 transition-transform ${open?'rotate-180':''}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    {open && (
                        <div className="absolute top-full left-0 mt-1.5 w-64 bg-[#0f0f0f] border border-zinc-800 rounded-xl shadow-2xl shadow-black/50 z-50 overflow-hidden fade-in">
                            <div className="flex items-center justify-between px-3 py-2 border-b border-zinc-800/50">
                                <button onClick={() => { setPeriodoActivo(actual); setOpen(false); }} className="flex items-center gap-1.5 text-[10px] text-zinc-500 hover:text-[#5dbd8c] transition-colors">
                                    <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    Presente
                                </button>
                                <button onClick={() => setShowPicker(!showPicker)} className={`flex items-center gap-1 text-[10px] transition-colors ${showPicker ? 'text-[#5dbd8c]' : 'text-zinc-500 hover:text-zinc-300'}`}>
                                    <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                    Buscar
                                </button>
                            </div>
                            {showPicker && (
                                <div className="px-3 py-2.5 border-b border-zinc-800/50 bg-zinc-900/30 flex items-center gap-2">
                                    {/* Mes: dropdown in-app */}
                                    <div className="relative flex-1" ref={monthRef}>
                                        <button onClick={() => { setOpenMonthDrop(!openMonthDrop); setOpenYearDrop(false); }} className="w-full bg-zinc-800 border border-zinc-700 rounded px-2.5 py-1.5 text-[11px] text-zinc-200 text-left flex items-center justify-between hover:border-zinc-600 transition-colors">
                                            {meses[pickMonth-1]}
                                            <svg className="w-3 h-3 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                                        </button>
                                        {openMonthDrop && (
                                            <div className="absolute top-full left-0 mt-1 w-full bg-zinc-800 border border-zinc-700 rounded-lg shadow-xl z-50 max-h-36 overflow-y-auto custom-scroll">
                                                {meses.map((m,i) => (
                                                    <button key={m} onClick={() => { setPickMonth(i+1); setOpenMonthDrop(false); }} className={`w-full text-left px-2.5 py-1.5 text-[11px] hover:bg-zinc-700 transition-colors ${pickMonth === i+1 ? 'text-[#5dbd8c] font-bold' : 'text-zinc-300'}`}>{m}</button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    {/* Año: dropdown in-app */}
                                    <div className="relative w-20" ref={yearRef}>
                                        <button onClick={() => { setOpenYearDrop(!openYearDrop); setOpenMonthDrop(false); }} className="w-full bg-zinc-800 border border-zinc-700 rounded px-2.5 py-1.5 text-[11px] text-zinc-200 text-left flex items-center justify-between hover:border-zinc-600 transition-colors">
                                            {pickYear}
                                            <svg className="w-3 h-3 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                                        </button>
                                        {openYearDrop && (
                                            <div className="absolute top-full left-0 mt-1 w-full bg-zinc-800 border border-zinc-700 rounded-lg shadow-xl z-50 max-h-36 overflow-y-auto custom-scroll">
                                                {años.map(y => (
                                                    <button key={y} onClick={() => { setPickYear(y); setOpenYearDrop(false); }} className={`w-full text-left px-2.5 py-1.5 text-[11px] hover:bg-zinc-700 transition-colors ${pickYear === y ? 'text-[#5dbd8c] font-bold' : 'text-zinc-300'}`}>{y}</button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <button onClick={() => { const p = buscarPeriodo(pickMonth, pickYear); setPeriodoActivo(p); setOpen(false); setShowPicker(false); }} className="bg-[#5dbd8c] text-black px-3 py-1.5 rounded text-[10px] font-bold hover:bg-white transition-colors flex-shrink-0">Ir</button>
                                </div>
                            )}
                            <div className="max-h-56 overflow-y-auto custom-scroll">
                                {/* ── Pasados ── */}
                                {pasados.length > 0 && (
                                    <div className="text-[9px] text-zinc-600 uppercase tracking-wider px-3 pt-2 pb-1 font-bold">Pasados</div>
                                )}
                                {hiddenPastCount > 0 && (
                                    <button onClick={() => setShowMorePast(!showMorePast)} className="w-full text-left px-3 py-1.5 text-[10px] text-zinc-500 hover:text-zinc-300 hover:bg-zinc-900/50 transition-colors">
                                        {showMorePast ? '▲ Contraer' : `▼ ${hiddenPastCount} más...`}
                                    </button>
                                )}
                                {pastSlice.map(p => {
                                    const isActive = p === periodoActivo;
                                    const isCurrent = p === actual;
                                    return (
                                        <button key={p} onClick={() => { setPeriodoActivo(p); setOpen(false); }} className={`w-full text-left px-3 py-1.5 flex items-center justify-between transition-colors ${isActive ? 'bg-[#5dbd8c]/15 border-l-2 border-[#5dbd8c]' : 'hover:bg-zinc-900/50 border-l-2 border-transparent'}`}>
                                            <span className={`text-[11px] font-mono ${isActive ? 'text-[#5dbd8c] font-bold' : isCurrent ? 'text-white font-semibold' : 'text-zinc-500'}`}>{p}</span>
                                            <span className="text-[8px] text-zinc-600">{isCurrent ? 'Actual' : isActive ? 'Selecc.' : ''}</span>
                                        </button>
                                    );
                                })}
                                {/* ── Presente ── */}
                                {presente.length > 0 && (
                                    <div className="text-[9px] text-[#5dbd8c] uppercase tracking-wider px-3 pt-2 pb-1 font-bold border-t border-zinc-800/30">Presente</div>
                                )}
                                {presente.map(p => {
                                    const isActive = p === periodoActivo;
                                    return (
                                        <button key={p} onClick={() => { setPeriodoActivo(p); setOpen(false); }} className={`w-full text-left px-3 py-1.5 flex items-center justify-between transition-colors ${isActive ? 'bg-[#5dbd8c]/15 border-l-2 border-[#5dbd8c]' : 'hover:bg-zinc-900/50 border-l-2 border-transparent'}`}>
                                            <span className={`text-[11px] font-mono ${isActive ? 'text-[#5dbd8c] font-bold' : 'text-white font-semibold'}`}>{p}</span>
                                        </button>
                                    );
                                })}
                                {/* ── Futuros ── */}
                                {futuros.length > 0 && (
                                    <div className="text-[9px] text-zinc-600 uppercase tracking-wider px-3 pt-2 pb-1 font-bold border-t border-zinc-800/30">Futuros</div>
                                )}
                                {futureSlice.map(p => {
                                    const isActive = p === periodoActivo;
                                    const isCurrent = p === actual;
                                    return (
                                        <button key={p} onClick={() => { setPeriodoActivo(p); setOpen(false); }} className={`w-full text-left px-3 py-1.5 flex items-center justify-between transition-colors ${isActive ? 'bg-[#5dbd8c]/15 border-l-2 border-[#5dbd8c]' : 'hover:bg-zinc-900/50 border-l-2 border-transparent'}`}>
                                            <span className={`text-[11px] font-mono ${isActive ? 'text-[#5dbd8c] font-bold' : isCurrent ? 'text-white font-semibold' : 'text-zinc-400'}`}>{p}</span>
                                            <span className="text-[8px] text-zinc-600">{isCurrent ? 'Actual' : isActive ? 'Selecc.' : ''}</span>
                                        </button>
                                    );
                                })}
                                {hiddenFutureCount > 0 && (
                                    <button onClick={() => setShowMoreFuture(!showMoreFuture)} className="w-full text-left px-3 py-1.5 text-[10px] text-zinc-500 hover:text-zinc-300 hover:bg-zinc-900/50 transition-colors">
                                        {showMoreFuture ? '▲ Contraer' : `▼ ${hiddenFutureCount} más...`}
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // === PESTAÑA: RECORDATORIOS ===
        const RecordatoriosTab = React.memo(({ logs, onEdit, loadData, viewScope, setViewScope }) => {
            const [busqueda, setBusqueda] = useState('');
            const [lanzandoId, setLanzandoId] = useState(null);
            const [deletingRecId, setDeletingRecId] = useState(null); 
            const [fechaLanzamiento, setFechaLanzamiento] = useState(getHoyStr());

            const getEstado = (fechaStr) => {
                if(!fechaStr) return { text: '', color: '' };
                const [d,m,y] = fechaStr.split('/');
                const f = new Date(y, m-1, d); const h = new Date();
                f.setHours(0,0,0,0); h.setHours(0,0,0,0);
                const diff = Math.ceil((f - h) / (1000*60*60*24));
                if (diff < 0) return { text: `Caducado (${Math.abs(diff)}d)`, color: 'text-rose-500 font-bold bg-rose-500/10 px-2 py-1 rounded' };
                if (diff === 0) return { text: '¡Vence Hoy!', color: 'text-amber-500 font-bold bg-amber-500/10 px-2 py-1 rounded' };
                if (diff === 1) return { text: 'Mañana', color: 'text-[#5dbd8c]' };
                return { text: `En ${diff} días`, color: 'text-zinc-500' };
            };

            const ejecutando = (id) => { apiCall('lanzarRecordatorio', { id: id, fecha: fechaLanzamiento }).then(() => { setLanzandoId(null); loadData(); }); };

            const filteredLogs = useMemo(() => {
                let mapeados = logs.filter(l => {
                    if (l.Tipo_Operacion === 'Transferencia') {
                        if (viewScope === 'Compartido') return false; 
                        if (viewScope === 'Josue' && l.Registrador !== 'Josué') return false;
                        if (viewScope === 'Abi' && l.Registrador !== 'Abigail') return false; 
                    } else {
                        if (viewScope === 'Compartido' && l.Tipo_Gasto && l.Tipo_Gasto.includes('Personal')) return false;
                        if (viewScope === 'Josue' && !(Number(l.Participacion_Josue) > 0)) return false;
                        if (viewScope === 'Abi' && !(Number(l.Participacion_Abi) > 0)) return false;
                    }
                    return true;
                });
                if (busqueda) {
                    const q = busqueda.toLowerCase();
                    mapeados = mapeados.filter(l => Object.values(l).some(val => String(val).toLowerCase().includes(q)));
                }
                return mapeados.sort((a,b) => {
                    const pa = (s) => { const [d,m,y]=s.split('/'); return new Date(y,m-1,d).getTime(); };
                    return pa(a.Fecha_Compra) - pa(b.Fecha_Compra);
                });
            }, [logs, viewScope, busqueda]);

            return (
                <div className="space-y-6 fade-in">
                    <div className="glass-card p-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex gap-2 bg-zinc-900/50 p-1 rounded border border-zinc-800 w-full md:w-auto">
                            {['Compartido', 'Josue', 'Abi'].map(s=><button key={s} onClick={() => setViewScope(s)} className={`px-4 py-2 text-[10px] font-bold uppercase rounded flex-1 md:flex-none transition-colors ${viewScope === s ? 'bg-[#5dbd8c] text-black' : 'text-zinc-500 hover:text-white'}`}>{s==='Compartido'?'Hogar':s}</button>)}
                        </div>
                        <input className="w-full md:w-72 p-2 text-xs rounded bg-black border border-zinc-800 outline-none text-zinc-300" placeholder="Buscar recordatorio..." value={busqueda} onChange={e=>setBusqueda(e.target.value)} />
                    </div>

                    <div className="glass-card overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-[11px] whitespace-nowrap">
                                <thead className="bg-zinc-900 text-zinc-400 uppercase font-bold">
                                    <tr><th className="p-3">Programado</th><th className="p-3">Estado</th><th className="p-3">Concepto</th><th className="p-3 text-[#5dbd8c]">Categoría</th><th className="p-3">Cuenta Origen</th><th className="p-3 text-right">Monto Parcial</th></tr>
                                </thead>
                                <tbody className="divide-y divide-zinc-900">
                                    {filteredLogs.map((log, idx) => {
                                        const estado = getEstado(log.Fecha_Compra);
                                        const colorFila = log.Tipo_Operacion === 'Ingreso' ? 'text-[#5dbd8c]' : (log.Tipo_Operacion === 'Transferencia' ? 'text-indigo-400' : 'text-zinc-200');
                                        
                                        return (
                                            <tr key={idx} tabIndex="0" className="hover:bg-zinc-900/50 group focus-within:bg-zinc-900/50">
                                                <td className="p-3 text-zinc-500 font-mono">{log.Fecha_Compra}</td>
                                                <td className="p-3"><span className={estado.color}>{estado.text}</span></td>
                                                <td className={`p-3 font-bold ${colorFila}`}>
                                                    <div className="flex items-center gap-2">
                                                        <span>{log.Compra}</span>
                                                        <span className="text-[8px] border border-zinc-700 px-1 rounded text-zinc-500 uppercase">{log.Tipo_Operacion}</span>
                                                        <div className="opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity flex gap-2 ml-2">
                                                            <button onClick={() => onEdit(log)} className="text-zinc-500 hover:text-[#5dbd8c]"><IconEdit /></button>
                                                            {deletingRecId === log.ID_Unico ? (
                                                                <div className="flex gap-1 bg-black p-1 rounded border border-rose-500/50">
                                                                    <button onClick={() => { setDeletingRecId(null); const trash = JSON.parse(localStorage.getItem('fl_trash')||'[]'); trash.unshift(log); localStorage.setItem('fl_trash',JSON.stringify(trash)); apiCall('eliminarGasto', log.ID_Unico).then(()=>loadData()); }} className="text-rose-500 px-2 font-bold text-[9px] hover:bg-rose-500/20 rounded">Eliminar</button>
                                                                    <button onClick={() => setDeletingRecId(null)} className="text-zinc-500 px-1 text-[9px] hover:bg-zinc-800 rounded">Cancelar</button>
                                                                </div>
                                                            ) : (
                                                                <button onClick={() => setDeletingRecId(log.ID_Unico)} className="text-zinc-500 hover:text-rose-500"><IconDelete /></button>
                                                            )}
                                                            <button onClick={() => { setLanzandoId(log.ID_Unico); setFechaLanzamiento(getHoyStr()); }} className="text-indigo-400 hover:text-white bg-indigo-500/20 px-2 py-1 rounded flex gap-1 items-center font-bold"><IconLaunch /> Ejecutar</button>
                                                        </div>
                                                    </div>
                                                    
                                                    {lanzandoId === log.ID_Unico && (
                                                        <div className="mt-2 p-2 bg-black rounded border border-indigo-500/50 flex gap-2 items-center fade-in max-w-sm">
                                                            <span className="text-[9px] text-indigo-300 uppercase font-bold">Lanzar con fecha:</span>
                                                            <input type="date" className="p-1 rounded text-xs bg-zinc-900 text-white outline-none" value={fechaLanzamiento} onChange={e=>setFechaLanzamiento(e.target.value)} />
                                                            <button onClick={()=>ejecutando(log.ID_Unico)} className="bg-indigo-500 text-white px-2 py-1 rounded text-xs font-bold hover:bg-indigo-400">Confirmar</button>
                                                            <button onClick={()=>setLanzandoId(null)} className="text-zinc-500 hover:text-white text-xs px-2"><IconClose /></button>
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="p-3 text-zinc-400"><span className="text-[9px] text-zinc-600 block">{log.MacroCategoria}</span>{log.Categoria}</td>
                                                <td className="p-3 text-zinc-500">{log.Cuenta_Origen}{log.Cuenta_Destino && <> <IconArrowRight /> {log.Cuenta_Destino}</>}</td>
                                                <td className="p-3 font-mono text-[#5dbd8c] text-right">{formatoMoneda(log.Monto_Parcial)}</td>
                                            </tr>
                                        );
                                    })}
                                    {filteredLogs.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-zinc-600 font-mono">No hay recordatorios pendientes.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        });

        // === PESTAÑA: GESTOR DE CUENTAS ===
        const CuentasManager = React.memo(({ cuentas, logs, loadData }) => {
            const [localCuentas, setLocalCuentas] = useState(cuentas);
            const [saving, setSaving] = useState(false);
            const [form, setForm] = useState({ nombre: '', tipo: 'Activo', saldoInicial: '', propietario: 'Josué', diaCorte: '', limiteCredito: '', fechaVencimiento: '' });
            const [deletingCuenta, setDeletingCuenta] = useState(null); 

            const handleEdit = (idx, field, val) => { const updated = [...localCuentas]; updated[idx][field] = val; setLocalCuentas(updated); };
            const agregarCuenta = () => { if (!form.nombre.trim()) return; setLocalCuentas([...localCuentas, { ...form, nombre: form.nombre.trim() }]); setForm({ nombre: '', tipo: 'Activo', saldoInicial: '', propietario: 'Josué', diaCorte: '', limiteCredito: '', fechaVencimiento: '' }); };
            const eliminarCuenta = (nombre) => { setLocalCuentas(localCuentas.filter(c => c.nombre !== nombre)); setDeletingCuenta(null); };
            const guardar = () => { setSaving(true); apiCall('guardarCuentas', localCuentas).then(() => { setSaving(false); loadData(); }); };

            return (
                <div className="glass-card p-6 md:p-8 fade-in space-y-6">
                    <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                        <h2 className="text-xs font-bold uppercase tracking-widest text-zinc-500">Gestor de Cuentas</h2>
                        <button onClick={guardar} className="bg-[#5dbd8c] text-black px-6 py-2 text-[10px] font-black uppercase rounded hover:bg-white">{saving ? 'Guardando...' : 'Aplicar Cambios'}</button>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4 bg-zinc-900/50 p-4 rounded border border-zinc-800">
                        <div><label className="text-[9px] uppercase text-zinc-500 mb-1 block">Nombre</label><input className="w-full p-2 text-xs rounded bg-black" placeholder="Ej. Nu" value={form.nombre} onChange={e=>setForm({...form, nombre: e.target.value})} /></div>
                        <div><label className="text-[9px] uppercase text-zinc-500 mb-1 block">Tipo</label><select className="w-full p-2 text-xs rounded bg-black" value={form.tipo} onChange={e=>setForm({...form, tipo: e.target.value})}><option>Activo</option><option>Pasivo</option></select></div>
                        <div><label className="text-[9px] uppercase text-zinc-500 mb-1 block">Propietario</label><select className="w-full p-2 text-xs rounded bg-black" value={form.propietario} onChange={e=>setForm({...form, propietario: e.target.value})}><option>Josué</option><option>Abi</option><option>Hogar</option></select></div>
                        <div>
                            <label className="text-[9px] uppercase text-zinc-500 mb-1 block">Día Corte</label>
                            {form.tipo === 'Pasivo' ? (
                                <input type="number" className="w-full p-2 text-xs rounded bg-black" placeholder="Ej. 19" value={form.diaCorte} onChange={e=>setForm({...form, diaCorte: e.target.value})} />
                            ) : (
                                <div className="w-full p-2 text-xs rounded bg-black text-zinc-600 font-mono cursor-not-allowed text-center">N/A</div>
                            )}
                        </div>
                        <div><label className="text-[9px] uppercase text-zinc-500 mb-1 block">Inicial</label><div className="flex gap-2"><input type="number" step="0.01" className="w-full p-2 text-xs rounded bg-black font-mono text-[#5dbd8c]" placeholder="0.00" value={form.saldoInicial} onChange={e=>setForm({...form, saldoInicial: e.target.value})} /><button onClick={agregarCuenta} className="bg-zinc-800 px-4 rounded text-white font-bold hover:bg-[#3d8068]">+</button></div></div>
                    </div>

                    {form.tipo === 'Pasivo' && (
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 bg-zinc-900/30 p-4 rounded border border-zinc-800/50 fade-in">
                        <div><label className="text-[9px] uppercase text-zinc-500 mb-1 block">Límite Crédito</label><input type="number" step="100" className="w-full p-2 text-xs rounded bg-black font-mono text-amber-400" placeholder={form.saldoInicial || 'Ej. 50000'} value={form.limiteCredito} onChange={e=>setForm({...form, limiteCredito: e.target.value})} /></div>
                        <div><label className="text-[9px] uppercase text-zinc-500 mb-1 block">Día Vencimiento</label><input type="number" min="1" max="31" className="w-full p-2 text-xs rounded bg-black" placeholder="Ej. 10" value={form.fechaVencimiento} onChange={e=>setForm({...form, fechaVencimiento: e.target.value})} /></div>
                        <div className="md:col-span-2 flex items-end"><span className="text-[8px] text-zinc-600">Estos campos son para tarjetas de crédito. Se reflejarán en el Panel.</span></div>
                    </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {localCuentas.map((c, i) => {
                            let balance = Number(c.saldoInicial) || 0;
                            logs.forEach(l => {
                                const m = Number(l.Monto_Parcial) || 0;
                                if (l.Cuenta_Origen === c.nombre) {
                                    if (l.Tipo_Operacion === 'Gasto' || l.Tipo_Operacion === 'Transferencia') balance -= m;
                                    else if (l.Tipo_Operacion === 'Ingreso') balance += m;
                                }
                                if (l.Tipo_Operacion === 'Transferencia' && l.Cuenta_Destino === c.nombre) balance += m;
                            });
                            return (
                                <div key={i} tabIndex="0" className="bg-zinc-900/50 p-4 rounded border border-zinc-800 space-y-3 relative group focus-within:bg-zinc-900/80 transition-colors">
                                    {deletingCuenta === c.nombre ? (
                                        <div className="absolute top-2 right-2 flex gap-1 z-10 bg-black p-1 rounded border border-rose-500/50">
                                            <button onClick={()=>eliminarCuenta(c.nombre)} className="text-rose-500 text-[9px] font-bold px-2 hover:bg-rose-500/20 rounded">Eliminar</button>
                                            <button onClick={()=>setDeletingCuenta(null)} className="text-zinc-500 text-[9px] px-2 hover:bg-zinc-800 rounded">Cancelar</button>
                                        </div>
                                    ) : (
                                        <button onClick={()=>setDeletingCuenta(c.nombre)} className="absolute top-2 right-2 text-zinc-600 hover:text-rose-500 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity"><IconDelete /></button>
                                    )}

                                    <div className="flex justify-between pr-4">
                                        <input className="bg-transparent font-bold text-[#5dbd8c] outline-none w-1/2" value={c.nombre} onChange={e=>handleEdit(i, 'nombre', e.target.value)} />
                                        <div className="flex flex-col items-end">
                                            <select className="bg-transparent text-[9px] uppercase text-zinc-500 text-right outline-none" value={c.propietario} onChange={e=>handleEdit(i, 'propietario', e.target.value)}><option>Josué</option><option>Abi</option><option>Hogar</option></select>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="flex-1"><label className="text-[8px] text-zinc-600 block uppercase">Inicial</label><input type="number" step="0.01" className="bg-transparent font-mono text-sm w-full border-b border-zinc-800 outline-none" value={c.saldoInicial} onChange={e=>handleEdit(i, 'saldoInicial', e.target.value)} /></div>
                                        <div className="flex-1"><label className="text-[8px] text-zinc-600 block uppercase">Corte</label>
                                            {c.tipo.trim() === 'Pasivo' ? <input type="number" className="bg-transparent font-mono text-sm w-full border-b border-zinc-800 outline-none" value={c.diaCorte} onChange={e=>handleEdit(i, 'diaCorte', e.target.value)} /> : <span className="font-mono text-sm text-zinc-500 block mt-1">N/A</span>}
                                        </div>
                                    </div>
                                    {c.tipo.trim() === 'Pasivo' && (
                                    <div className="flex items-center gap-4 fade-in">
                                        <div className="flex-1"><label className="text-[8px] text-zinc-600 block uppercase">Límite Crédito</label><input type="number" step="100" className="bg-transparent font-mono text-sm w-full border-b border-zinc-800 outline-none text-amber-400" value={c.limiteCredito || ''} onChange={e=>handleEdit(i, 'limiteCredito', e.target.value)} placeholder={c.saldoInicial} /></div>
                                        <div className="flex-1"><label className="text-[8px] text-zinc-600 block uppercase">Vencimiento</label><input type="number" min="1" max="31" className="bg-transparent font-mono text-sm w-full border-b border-zinc-800 outline-none" value={c.fechaVencimiento || ''} onChange={e=>handleEdit(i, 'fechaVencimiento', e.target.value)} placeholder="10" /></div>
                                    </div>
                                    )}
                                    <div className="border-t border-zinc-800 pt-2 flex justify-between items-center">
                                        <span className={`text-[8px] uppercase px-2 py-1 rounded ${c.tipo.trim()==='Pasivo'?'bg-rose-500/20 text-rose-400':'bg-[#3d8068]/20 text-[#5dbd8c]'}`}>{c.tipo}</span>
                                        <p className={`font-mono font-bold text-lg ${c.tipo.trim()==='Pasivo'?'text-rose-400':'text-zinc-800'}`}>{formatoMoneda(c.tipo.trim()==='Pasivo' ? balance * -1 : balance)}</p>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        });

        // === PESTAÑA: TABLERO ===
        const Dashboard = React.memo(({ rawLogs, presupuesto, cuentas, onEdit, periodoActivo, setPeriodoActivo, periodos, viewScope, setViewScope }) => {
            const [deletingLog, setDeletingLog] = useState(null);
            const [busqueda, setBusqueda] = useState('');
            const busquedaDebounced = useDebounce(busqueda, 250);
            const [filtroCategorias, setFiltroCategorias] = useState([]);
            const [showSearch, setShowSearch] = useState(false);
            const [showAdvSearch, setShowAdvSearch] = useState(false);
            const [advDateFrom, setAdvDateFrom] = useState('');
            const [advDateTo, setAdvDateTo] = useState('');
            const [advAmountMin, setAdvAmountMin] = useState('');
            const [advAmountMax, setAdvAmountMax] = useState('');
            const [advCategories, setAdvCategories] = useState([]);
            const [advAccounts, setAdvAccounts] = useState([]);
            const [advTags, setAdvTags] = useState([]);
            const [advTipoGasto, setAdvTipoGasto] = useState([]);

            const getPeriodoActual = () => { const hoy = new Date(); let m = hoy.getMonth(), a = hoy.getFullYear(); if (hoy.getDate() > 19) m += 1; const u = new Date(a, m + 1, 0); return `${String(u.getDate()).padStart(2, '0')}/${String(u.getMonth() + 1).padStart(2, '0')}/${u.getFullYear()}`; };
            const [modoAcumulado, setModoAcumulado] = useState(false);
            useEffect(() => { setFiltroCategorias([]); }, [viewScope, periodoActivo]);

            const logsGlobal = useMemo(() => modoAcumulado ? rawLogs : rawLogs.filter(l => l.Periodo_Pago === periodoActivo), [rawLogs, periodoActivo, modoAcumulado]);
            const logsGrafico = useMemo(() => logsGlobal.filter(l => {
                if (l.Tipo_Operacion === 'Transferencia' || l.Tipo_Operacion === 'Ingreso') return false; 
                if (viewScope === 'Compartido') return !l.Tipo_Gasto.includes('Personal');
                if (viewScope === 'Josue') return Number(l.Participacion_Josue) > 0;
                if (viewScope === 'Abi') return Number(l.Participacion_Abi) > 0;
                if (filtroCategorias.length > 0 && !filtroCategorias.includes(l.Categoria)) return false;
                return false;
            }), [logsGlobal, viewScope, filtroCategorias]);

            // ── Datos para búsqueda avanzada ──
            const allCategories = useMemo(() => [...new Set(logsGlobal.map(l => l.Categoria).filter(Boolean))].sort(), [logsGlobal]);
            const allAccounts = useMemo(() => cuentas.map(c => c.nombre).sort(), [cuentas]);
            const allTags = useMemo(() => { const tags = new Set(); rawLogs.forEach(l => { if (l.Tags) l.Tags.split(',').forEach(t => { const tt = t.trim(); if (tt) tags.add(tt); }); }); return [...tags].sort(); }, [rawLogs]);
            const allTipoGasto = useMemo(() => [...new Set(logsGlobal.map(l => l.Tipo_Gasto).filter(Boolean))].sort(), [logsGlobal]);
            const allCategoriesGasto = useMemo(() => [...new Set(logsGlobal.filter(l => l.Tipo_Operacion === 'Gasto').map(l => l.Categoria).filter(Boolean))].sort(), [logsGlobal]);
            const allCategoriesIngreso = useMemo(() => [...new Set(logsGlobal.filter(l => l.Tipo_Operacion === 'Ingreso').map(l => l.Categoria).filter(Boolean))].sort(), [logsGlobal]);
            const advFiltersActive = advDateFrom || advDateTo || advAmountMin || advAmountMax || advCategories.length > 0 || advAccounts.length > 0 || advTags.length > 0 || advTipoGasto.length > 0;

            const auditoriaRows = useMemo(() => {
                let rows = [];
                logsGlobal.forEach(l => {
                    if (l.Tipo_Operacion !== 'Transferencia') {
                        if (viewScope === 'Compartido' && l.Tipo_Gasto && l.Tipo_Gasto.includes('Personal')) return;
                        if (viewScope === 'Josue' && !(Number(l.Participacion_Josue) > 0)) return;
                        if (viewScope === 'Abi' && !(Number(l.Participacion_Abi) > 0)) return;
                    }
                    if (filtroCategorias.length > 0 && !filtroCategorias.includes(l.Categoria)) return;
                    if (advCategories.length > 0 && !advCategories.includes(l.Categoria)) return;
                    if (advAccounts.length > 0 && !advAccounts.includes(l.Cuenta_Origen) && !(l.Tipo_Operacion==='Transferencia' && advAccounts.includes(l.Cuenta_Destino))) return;
                    if (advTags.length > 0) { const rowTags = (l.Tags || '').split(',').map(t => t.trim()); if (!advTags.some(t => rowTags.includes(t))) return; }
                    if (advTipoGasto.length > 0 && !advTipoGasto.includes(l.Tipo_Gasto)) return;
                    if (advDateFrom && l.Fecha_Compra < advDateFrom) return;
                    if (advDateTo && l.Fecha_Compra > advDateTo) return;
                    const mParcial = Number(l.Monto_Parcial) || 0;
                    const mTotal = Number(l.Monto_Total) || 0;
                    if (advAmountMin && mParcial < Number(advAmountMin)) return;
                    if (advAmountMax && mParcial > Number(advAmountMax)) return;
                    if (busquedaDebounced.trim() !== '') {
                        const q = busquedaDebounced.toLowerCase();
                        if (!((l.Compra && l.Compra.toLowerCase().includes(q)) || (l.Categoria && l.Categoria.toLowerCase().includes(q)) ||
                            (l.MacroCategoria && l.MacroCategoria.toLowerCase().includes(q)) || (l.Cuenta_Origen && l.Cuenta_Origen.toLowerCase().includes(q)) ||
                            (l.Cuenta_Destino && l.Cuenta_Destino.toLowerCase().includes(q)) || (l.Fecha_Compra && l.Fecha_Compra.includes(q)) ||
                            (l.Monto_Total && String(l.Monto_Total).includes(q)))) return;
                    }
                    if (l.Tipo_Operacion === 'Transferencia') {
                        rows.push({ ...l, _key: l.ID_Unico+'_out', _cuenta: l.Cuenta_Origen, _amount: -mParcial, _color: 'text-indigo-400', _parcial: mParcial, _total: mTotal });
                        rows.push({ ...l, _key: l.ID_Unico+'_in', _cuenta: l.Cuenta_Destino, _amount: mParcial, _color: 'text-[#5dbd8c]', _parcial: mParcial, _total: mTotal });
                    } else {
                        const aporte = viewScope === 'Compartido' ? mParcial : (viewScope === 'Josue' ? Number(l.Participacion_Josue) : Number(l.Participacion_Abi));
                        const isGasto = l.Tipo_Operacion === 'Gasto';
                        // Tag abreviado del tipo de gasto
                        let _tipoTag = '';
                        if (isGasto && l.Tipo_Gasto) {
                            const tg = l.Tipo_Gasto;
                            if (tg.includes('Personal')) _tipoTag = 'Per';
                            else if (tg.includes('Compartido')) _tipoTag = '50/50';
                            else if (tg.includes('Proporcional')) {
                                const m = tg.match(/\((\d+)/(\d+)\)/);
                                _tipoTag = m ? `${m[1]}/${m[2]}` : 'Prop';
                            }
                        }
                        rows.push({ ...l, _key: l.ID_Unico, _cuenta: l.Cuenta_Origen, _amount: isGasto ? -aporte : aporte, _color: isGasto ? 'text-rose-400' : 'text-[#5dbd8c]', _parcial: aporte, _total: mTotal, _tipoTag });
                    }
                });
                rows.sort((a, b) => { const ta = a._sortTS || 0, tb = b._sortTS || 0; if (ta !== tb) return tb - ta; return (a._regTS || 0) - (b._regTS || 0); });
                return rows;
            }, [logsGlobal, viewScope, filtroCategorias, busquedaDebounced, advCategories, advAccounts, advTags, advTipoGasto, advDateFrom, advDateTo, advAmountMin, advAmountMax]);

            const totalGastoView = logsGrafico.reduce((acc, l) => acc + (viewScope === 'Compartido' ? Number(l.Monto_Parcial) : (viewScope === 'Josue' ? Number(l.Participacion_Josue) : Number(l.Participacion_Abi))), 0);

            // ── Datos de Ingresos para donut ──
            const logsGraficoIngresos = useMemo(() => logsGlobal.filter(l => {
                if (l.Tipo_Operacion !== 'Ingreso') return false;
                if (viewScope === 'Compartido') return !(l.Tipo_Gasto && l.Tipo_Gasto.includes('Personal'));
                if (viewScope === 'Josue') return Number(l.Participacion_Josue) > 0;
                if (viewScope === 'Abi') return Number(l.Participacion_Abi) > 0;
                return false;
            }), [logsGlobal, viewScope]);
            const totalIngresoView = logsGraficoIngresos.reduce((acc, l) => acc + (viewScope === 'Compartido' ? Number(l.Monto_Parcial) : (viewScope === 'Josue' ? Number(l.Participacion_Josue) : Number(l.Participacion_Abi))), 0);
            const ingresosCategoriasData = useMemo(() => {
                let map = {};
                logsGraficoIngresos.forEach(l => {
                    let amt = viewScope === 'Compartido' ? Number(l.Monto_Parcial) : (viewScope === 'Josue' ? Number(l.Participacion_Josue) : Number(l.Participacion_Abi));
                    if (amt > 0) map[l.Categoria] = (map[l.Categoria] || 0) + amt;
                });
                return Object.keys(map).map(k => ({ nombre: k, total: map[k] })).sort((a,b) => b.total - a.total);
            }, [logsGraficoIngresos, viewScope]);

            const categoriasData = useMemo(() => {
                let map = {};
                logsGrafico.forEach(l => {
                    let amt = viewScope === 'Compartido' ? Number(l.Monto_Parcial) : (viewScope === 'Josue' ? Number(l.Participacion_Josue) : Number(l.Participacion_Abi));
                    if (amt > 0) map[l.Categoria] = (map[l.Categoria] || 0) + amt;
                });
                return Object.keys(map).map(k => ({ nombre: k, total: map[k] })).sort((a,b) => b.total - a.total);
            }, [logsGrafico, viewScope]);

            const currentPresupuesto = presupuesto[viewScope] || {};

            // ── Pie chart click state ──
            const [pieSelected, setPieSelected] = useState(null);
            const [donutModo, setDonutModo] = useState('gasto');

            const categoriasParaRender = useMemo(() => {
                let cats = [...categoriasData]; 
                Object.keys(currentPresupuesto).forEach(catName => { if (currentPresupuesto[catName] > 0 && !cats.find(c => c.nombre === catName)) cats.push({ nombre: catName, total: 0 }); });
                return cats;
            }, [categoriasData, currentPresupuesto]);
            const donutCategoriasRender = useMemo(() => donutModo === 'gasto' ? categoriasParaRender : ingresosCategoriasData, [donutModo, categoriasParaRender, ingresosCategoriasData]);

            // ── Donut dinámico (gasto o ingreso) ──
            const donutData = donutModo === 'gasto' ? categoriasData : ingresosCategoriasData;
            const donutTotal = donutModo === 'gasto' ? totalGastoView : totalIngresoView;

            // ── SVG Donut segments ──
            const pieSegments = useMemo(() => {
                if (donutData.length === 0 || donutTotal === 0) return [];
                let startAngle = -Math.PI / 2;
                return donutData.map((cat, i) => {
                    const pct = cat.total / donutTotal;
                    const angle = pct * 2 * Math.PI;
                    const endAngle = startAngle + angle;
                    const result = { ...cat, pct, color: COLORES_PASTEL[i % COLORES_PASTEL.length], startAngle, endAngle };
                    startAngle = endAngle;
                    return result;
                });
            }, [donutData, donutTotal]);

            const sortedLogs = useMemo(() => auditoriaRows, [auditoriaRows]);
            const [pageSize, setPageSize] = useState(20);
            const [currentPage, setCurrentPage] = useState(1);
            useEffect(() => { setCurrentPage(1); }, [auditoriaRows.length, pageSize]);

            return (
                <div className="space-y-6 fade-in">
                    <div className="glass-card p-4 flex flex-col gap-3">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex gap-2 bg-zinc-900/50 p-1 rounded border border-zinc-800 w-full md:w-auto">
                                {['Compartido', 'Josue', 'Abi'].map(s=><button key={s} onClick={() => setViewScope(s)} className={`px-4 py-2 text-[10px] font-bold uppercase rounded flex-1 md:flex-none transition-colors ${viewScope === s ? 'bg-[#5dbd8c] text-black' : 'text-zinc-500 hover:text-white'}`}>{s==='Compartido'?'Hogar':s}</button>)}
                            </div>
                            <div className="flex items-center gap-3 w-full md:w-auto">
                                {!modoAcumulado && <PeriodSelector periodos={periodos} periodoActivo={periodoActivo} setPeriodoActivo={setPeriodoActivo} getPeriodoActual={getPeriodoActual} label="Corte" />}
                                <button onClick={() => setModoAcumulado(!modoAcumulado)} className="flex items-center gap-0 bg-zinc-900 border border-zinc-800 rounded-full p-0.5 transition-colors hover:border-zinc-700 flex-shrink-0">
                                    <span className={`px-2.5 py-1 rounded-full text-[9px] font-bold uppercase transition-all ${!modoAcumulado ? 'bg-[#5dbd8c] text-black' : 'text-zinc-500'}`}>Período</span>
                                    <span className={`px-2.5 py-1 rounded-full text-[9px] font-bold uppercase transition-all ${modoAcumulado ? 'bg-[#5dbd8c] text-black' : 'text-zinc-500'}`}>Acum.</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* ── Donut interactivo + Categorías ── */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="glass-card p-6 flex flex-col items-center">
                            <div className="flex justify-between items-center mb-4 w-full">
                                <h3 className="text-xs font-bold uppercase tracking-widest text-zinc-500 flex items-center gap-2 flex-wrap">
                                    Distribución
                                    {filtroCategorias.length > 0 && (
                                        <button onClick={() => { setFiltroCategorias([]); setPieSelected(null); }} className="text-[9px] bg-[#3d8068]/20 text-[#5dbd8c] px-2 py-0.5 rounded hover:bg-rose-500/20 hover:text-rose-400 transition-colors">
                                            <IconClose /> {filtroCategorias.length} selecc.
                                        </button>
                                    )}
                                </h3>
                                <button onClick={() => setDonutModo(donutModo === 'gasto' ? 'ingreso' : 'gasto')} className="flex items-center gap-0 bg-zinc-900 border border-zinc-800 rounded-full p-0.5 transition-colors hover:border-zinc-700">
                                    <span className={`px-2.5 py-1 rounded-full text-[9px] font-bold uppercase transition-all ${donutModo === 'gasto' ? 'bg-[#5dbd8c] text-black' : 'text-zinc-500'}`}>Gasto</span>
                                    <span className={`px-2.5 py-1 rounded-full text-[9px] font-bold uppercase transition-all ${donutModo === 'ingreso' ? 'bg-[#5dbd8c] text-black' : 'text-zinc-500'}`}>Ingreso</span>
                                </button>
                            </div>
                            {donutData.length === 0 || donutTotal === 0 ? (
                                <div className="w-48 h-48 md:w-56 md:h-56 rounded-full flex items-center justify-center" style={{background:'#111'}}>
                                    <span className="text-zinc-600 text-xs">Sin {donutModo === 'gasto' ? 'gastos' : 'ingresos'}</span>
                                </div>
                            ) : (
                                <div className="relative">
                                    <svg viewBox="0 0 200 200" className="w-48 h-48 md:w-56 md:h-56 cursor-pointer" style={{filter:'drop-shadow(0 0 12px rgba(0,0,0,0.5))'}}>
                                        {pieSegments.map((seg, i) => {
                                            const isActive = filtroCategorias.length === 0 || filtroCategorias.includes(seg.nombre);
                                            const isDimmed = filtroCategorias.length > 0 && !filtroCategorias.includes(seg.nombre);
                                            const R_o = 90, R_i = 50, cx = 100, cy = 100;
                                            const a1 = seg.startAngle, a2 = seg.endAngle;
                                            const x1o = cx + R_o * Math.cos(a1), y1o = cy + R_o * Math.sin(a1);
                                            const x2o = cx + R_o * Math.cos(a2), y2o = cy + R_o * Math.sin(a2);
                                            const x1i = cx + R_i * Math.cos(a1), y1i = cy + R_i * Math.sin(a1);
                                            const x2i = cx + R_i * Math.cos(a2), y2i = cy + R_i * Math.sin(a2);
                                            const la = (a2 - a1) > Math.PI ? 1 : 0;
                                            const donutPath = `M ${x1o} ${y1o} A ${R_o} ${R_o} 0 ${la} 1 ${x2o} ${y2o} L ${x2i} ${y2i} A ${R_i} ${R_i} 0 ${la} 0 ${x1i} ${y1i} Z`;
                                            return (
                                                <g key={i}>
                                                    <path
                                                        d={donutPath}
                                                        fill={isDimmed ? seg.color + '33' : seg.color}
                                                        stroke="#050505" strokeWidth="1.5"
                                                        style={{transition:'fill 0.25s ease, opacity 0.25s ease', opacity: isDimmed ? 0.35 : 1}}
                                                        onClick={() => {
                                                            setFiltroCategorias(prev => prev.includes(seg.nombre) ? prev.filter(c => c !== seg.nombre) : [...prev, seg.nombre]);
                                                            setPieSelected(pieSelected === i ? null : i);
                                                        }}
                                                        onMouseEnter={() => setPieSelected(pieSelected === i ? null : i)}
                                                        onMouseLeave={() => setPieSelected(prev => prev === i ? null : prev)}
                                                    />
                                                </g>
                                            );
                                        })}
                                        <circle cx="100" cy="100" r="48" className="donut-center" strokeWidth="1" />
                                        {filtroCategorias.length === 1 && pieSegments.find(s => s.nombre === filtroCategorias[0]) ? (() => {
                                            const sel = pieSegments.find(s => s.nombre === filtroCategorias[0]);
                                            return (
                                                <>
                                                    <text x="100" y="86" textAnchor="middle" className="text-[9px] fill-zinc-500" style={{fontFamily:'JetBrains Mono,monospace'}}>{sel.nombre}</text>
                                                    <text x="100" y="106" textAnchor="middle" className="text-[15px] font-bold" fill={sel.color} style={{fontFamily:'JetBrains Mono,monospace'}}>{(sel.pct*100).toFixed(1)}%</text>
                                                    <text x="100" y="122" textAnchor="middle" className="text-[8px] fill-zinc-500" style={{fontFamily:'JetBrains Mono,monospace'}}>{formatoMoneda(sel.total)}</text>
                                                </>
                                            );
                                        })() : filtroCategorias.length > 1 ? (
                                            <>
                                                <text x="100" y="96" textAnchor="middle" className="text-[11px] font-bold fill-[#5dbd8c]" style={{fontFamily:'JetBrains Mono,monospace'}}>{filtroCategorias.length} cats</text>
                                                <text x="100" y="112" textAnchor="middle" className="text-[8px] fill-zinc-500" style={{fontFamily:'JetBrains Mono,monospace'}}>{formatoMoneda(donutTotal)}</text>
                                            </>
                                        ) : (
                                            <>
                                                <text x="100" y="96" textAnchor="middle" className="text-[11px] font-bold donut-text" style={{fontFamily:'JetBrains Mono,monospace'}}>{formatoMoneda(donutTotal)}</text>
                                                <text x="100" y="112" textAnchor="middle" className="text-[8px] fill-zinc-500" style={{fontFamily:'JetBrains Mono,monospace'}}>{donutModo === 'gasto' ? 'Total Gastos' : 'Total Ingresos'}</text>
                                            </>
                                        )}
                                    </svg>
                                </div>
                            )}
                        </div>
                        <div className="glass-card p-6 overflow-y-auto max-h-80">
                            <div className="space-y-1">
                                {donutCategoriasRender.map((catObj, i) => {
                                    const cat = catObj.nombre; const gastado = catObj.total;
                                    if (gastado === 0 && donutModo === 'gasto' && !currentPresupuesto[cat]) return null;
                                    if (gastado === 0 && donutModo === 'ingreso') return null;
                                    const catActive = filtroCategorias.length === 0 || filtroCategorias.includes(cat);
                                    const catDimmed = filtroCategorias.length > 0 && !filtroCategorias.includes(cat);
                                    return (
                                        <div key={cat} 
                                            onClick={() => { setFiltroCategorias(prev => prev.includes(cat) ? prev.filter(c => c !== cat) : [...prev, cat]); }}
                                            className="flex justify-between items-center text-[10px] px-2 py-1 rounded hover:bg-zinc-900/50 cursor-pointer transition-colors"
                                            style={{opacity: catDimmed ? 0.35 : 1, transition:'opacity 0.25s ease'}}
                                        >
                                            <div className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{backgroundColor: gastado > 0 ? COLORES_PASTEL[i % COLORES_PASTEL.length] : '#333'}}></span><span className={`${catDimmed ? 'text-zinc-600' : 'text-zinc-400'} truncate max-w-[140px]`}>{cat}</span></div>
                                            <span className={`font-mono ${catDimmed ? 'text-zinc-600' : 'text-[#5dbd8c]'}`}>{formatoMoneda(gastado)} <span className="text-[8px] text-zinc-500 ml-1">{donutTotal > 0 ? (gastado/donutTotal*100).toFixed(1) : 0}%</span></span>
                                        </div>
                                    );
                                })}

                    apiCall('agregarCategoriaMaster', {name, macro, tipo: formNew.tipo}).then(()=>loadData()); 
                    setFormNew({ ...formNew, nombre: '', macro: '' }); 
                }
