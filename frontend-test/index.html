                    )}
                </div>
            );
        });
        
        // ── LABELS VIEW ──
        const LabelsView = React.memo(({ logs, loadData }) => {
            const [labels, setLabels] = useState(() => {
                try { return JSON.parse(localStorage.getItem('fl_labels') || '[]'); } catch { return []; }
            });
            const [newLabel, setNewLabel] = useState('');
            const [newColor, setNewColor] = useState('#5dbd8c');
            const [editingIdx, setEditingIdx] = useState(null);
            const [editForm, setEditForm] = useState({ name: '', color: '' });
            const [deleteIdx, setDeleteIdx] = useState(null);
            
            // Count transactions per label tag
            const labelCounts = useMemo(() => {
                const counts = {};
                labels.forEach(l => { counts[l.name] = 0; });
                logs.forEach(l => {
                    if(l.Tags) {
                        const tags = l.Tags.split(',').map(t=>t.trim());
                        tags.forEach(t => { if(counts[t] !== undefined) counts[t]++; });
                    }
                });
                return counts;
            }, [logs, labels]);
            
            const saveLabels = (newLabels) => {
                setLabels(newLabels);
                localStorage.setItem('fl_labels', JSON.stringify(newLabels));
            };
            
            const addLabel = () => {
                const name = newLabel.trim();
                if(!name || labels.find(l=>l.name.toLowerCase()===name.toLowerCase())) return;
                saveLabels([...labels, { name, color: newColor }]);
                setNewLabel('');
            };
            
            const startEdit = (idx) => {
                setEditingIdx(idx);
                setEditForm({ name: labels[idx].name, color: labels[idx].color });
            };
            
            const saveEdit = () => {
                const updated = [...labels];
                updated[editingIdx] = { name: editForm.name.trim(), color: editForm.color };
                saveLabels(updated);
                setEditingIdx(null);
            };
            
            const confirmDelete = (idx) => {
                const updated = labels.filter((_, i) => i !== idx);
                saveLabels(updated);
                setDeleteIdx(null);
            };
            
            const labeledLogs = useMemo(() => {
                if(!labels.length) return [];
                return logs.filter(l => l.Tags && labels.some(lb => l.Tags.split(',').map(t=>t.trim()).includes(lb.name)));
            }, [logs, labels]);
            
            return (
                <div className="space-y-6 fade-in">
                    {/* Create label */}
                    <div className="glass-card p-4">
                        <h3 className="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-4">Crear Etiqueta</h3>
                        <div className="flex flex-col md:flex-row gap-2">
                            <input className="flex-1 p-2 rounded text-xs outline-none" placeholder="Nombre de etiqueta..." value={newLabel} onChange={e=>setNewLabel(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addLabel()} />
                            <div className="flex gap-2">
                                <input type="color" className="w-10 h-10 rounded cursor-pointer bg-black border border-zinc-800 p-0.5" value={newColor} onChange={e=>setNewColor(e.target.value)} />
                                <button onClick={addLabel} className="bg-[#3d8068] text-black px-4 py-2 rounded text-[10px] font-bold uppercase hover:bg-[#5dbd8c]">Añadir</button>
                            </div>
                        </div>
                    </div>
                    
                    {/* Labels list */}
                    <div className="glass-card overflow-hidden">
                        <div className="p-3 border-b border-zinc-800 bg-zinc-900/30">
                            <h3 className="text-xs font-bold uppercase tracking-widest text-zinc-500">Etiquetas ({labels.length})</h3>
                        </div>
                        {labels.length === 0 ? (
                            <div className="p-8 text-center text-zinc-600 text-xs">No hay etiquetas creadas. Crea una arriba ↑</div>
                        ) : (
                            <div className="divide-y divide-zinc-900">
                                {labels.map((l, i) => (
                                    <div key={i} className="p-3 flex items-center justify-between hover:bg-zinc-900/30 group transition-colors">
                                        {editingIdx === i ? (
                                            <div className="flex items-center gap-3 w-full">
                                                <input type="color" className="w-8 h-8 rounded cursor-pointer bg-black border border-zinc-800 p-0.5" value={editForm.color} onChange={e=>setEditForm({...editForm, color: e.target.value})} />
                                                <input className="flex-1 p-2 rounded text-xs bg-black outline-none text-white" value={editForm.name} onChange={e=>setEditForm({...editForm, name: e.target.value})} onKeyDown={e=>e.key==='Enter'&&saveEdit()} />
                                                <button onClick={saveEdit} className="text-[#5dbd8c] hover:text-white text-[10px] font-bold px-2"><IconCheck /></button>
                                                <button onClick={()=>setEditingIdx(null)} className="text-zinc-500 hover:text-white px-2"><IconClose /></button>
                                            </div>
                                        ) : (
                                            <>
                                                <div className="flex items-center gap-3">
                                                    <span className="w-3 h-3 rounded-full" style={{backgroundColor: l.color}}></span>
                                                    <span className="text-xs font-bold text-zinc-300">{l.name}</span>
                                                    <span className="text-[9px] text-zinc-600">{labelCounts[l.name] || 0} transacciones</span>
                                                </div>
                                                <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    <button onClick={()=>startEdit(i)} className="text-zinc-500 hover:text-[#5dbd8c] p-1"><IconEdit /></button>
                                                    {deleteIdx === i ? (
                                                        <div className="flex gap-1 bg-black p-1 rounded border border-rose-500/50">
                                                            <button onClick={()=>confirmDelete(i)} className="text-rose-500 px-2 font-bold text-[9px] hover:bg-rose-500/20 rounded">Eliminar</button>
                                                            <button onClick={()=>setDeleteIdx(null)} className="text-zinc-500 px-1 text-[9px] hover:bg-zinc-800 rounded">Cancelar</button>
                                                        </div>
                                                    ) : (
                                                        <button onClick={()=>setDeleteIdx(i)} className="text-zinc-500 hover:text-rose-500 p-1"><IconDelete /></button>
                                                    )}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    
                    {/* Labeled transactions */}
                    {labeledLogs.length > 0 && (
                        <div className="glass-card overflow-hidden">
                            <div className="p-3 border-b border-zinc-800 bg-zinc-900/30">
                                <h3 className="text-xs font-bold uppercase tracking-widest text-zinc-500">Transacciones Etiquetadas</h3>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-[10px]">
                                    <thead className="bg-zinc-900 text-zinc-400 uppercase font-bold">
                                        <tr><th className="p-2">Fecha</th><th className="p-2">Concepto</th><th className="p-2">Etiquetas</th><th className="p-2 text-right">Monto</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-zinc-900">
                                        {labeledLogs.slice(0, 50).map((l, i) => (
                                            <tr key={i} className="hover:bg-zinc-900/30">
                                                <td className="p-2 text-zinc-500 font-mono">{l.Fecha_Compra}</td>
                                                <td className="p-2 text-zinc-300 font-medium">{l.Compra}</td>
                                                <td className="p-2"><div className="flex flex-wrap gap-1">{(l.Tags||'').split(',').map((t,ti)=><span key={ti} className="text-[8px] px-1.5 py-0.5 rounded-full border border-zinc-700 text-zinc-400">{t.trim()}</span>)}</div></td>
                                                <td className={`p-2 font-mono text-right font-bold ${l.Tipo_Operacion==='Ingreso'?'text-[#5dbd8c]':'text-rose-400'}`}>{formatoMoneda(Number(l.Monto_Parcial)||0)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        });
        
        // ── TRASH VIEW ──
        const TrashView = React.memo(({ loadData }) => {
            const [trashItems, setTrashItems] = useState(() => {
                try { return JSON.parse(localStorage.getItem('fl_trash') || '[]'); } catch { return []; }
            });
            const [restoringId, setRestoringId] = useState(null);
            const [deletingId, setDeletingId] = useState(null);
            
            const saveTrash = (items) => {
                setTrashItems(items);
                localStorage.setItem('fl_trash', JSON.stringify(items));
            };
            
            const restoreItem = (id) => {
                setRestoringId(id);
                const item = trashItems.find(t => t.ID_Unico === id);
                if(!item) return;
                // Re-register the transaction
                const payload = {
                    tipoOperacion: item.Tipo_Operacion, fechaCompra: item.Fecha_Compra.split('/').reverse().join('-'),
                    registrador: item.Registrador, compra: item.Compra, monto: item.Monto_Total,
                    macroCategoria: item.MacroCategoria, categoria: item.Categoria,
                    cuentaOrigen: item.Cuenta_Origen, cuentaDestino: item.Cuenta_Destino,
                    tipoGasto: item.Tipo_Gasto, msi: '1', esRecordatorio: item.Es_Recordatorio === 'TRUE',
                    pctJosue: (item.Participacion_Josue && item.Participacion_Abi) ? Math.round(Number(item.Participacion_Josue)/(Number(item.Participacion_Josue)+Number(item.Participacion_Abi))*100) : 50,
                    pctAbi: (item.Participacion_Josue && item.Participacion_Abi) ? Math.round(Number(item.Participacion_Abi)/(Number(item.Participacion_Josue)+Number(item.Participacion_Abi))*100) : 50
                };
                apiCall('registrarOperacion', payload).then(() => {
                    saveTrash(trashItems.filter(t => t.ID_Unico !== id));
                    setRestoringId(null);
                    loadData();
                }).catch(() => setRestoringId(null));
            };
            
            const permanentDelete = (id) => {
                setDeletingId(id);
                saveTrash(trashItems.filter(t => t.ID_Unico !== id));
                setDeletingId(null);
            };
            
            const emptyTrash = () => {
                if(confirm('¿Eliminar permanentemente TODOS los elementos de la papelera?')) {
                    saveTrash([]);
                }
            };
            
            return (
                <div className="space-y-4 fade-in">
                    <div className="glass-card p-4 flex justify-between items-center">
                        <h2 className="text-xs font-bold uppercase tracking-widest text-zinc-500 flex items-center gap-2"><IconTrash /> Papelera</h2>
                        {trashItems.length > 0 && (
                            <button onClick={emptyTrash} className="text-[9px] bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded font-bold uppercase hover:bg-rose-500/30 transition-colors">Vaciar papelera</button>
                        )}
                    </div>
                    
                    {trashItems.length === 0 ? (
                        <div className="glass-card p-12 text-center">
                            <div className="text-zinc-700 mb-3"><IconTrash /></div>
                            <p className="text-zinc-600 text-xs">La papelera está vacía</p>
                            <p className="text-[9px] text-zinc-700 mt-1">Los elementos eliminados aparecerán aquí</p>
                        </div>
                    ) : (
                        <div className="glass-card overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-[10px]">
                                    <thead className="bg-zinc-900 text-zinc-400 uppercase font-bold">
                                        <tr><th className="p-3">Fecha</th><th className="p-3">Concepto</th><th className="p-3">Categoría</th><th className="p-3">Cuenta</th><th className="p-3 text-right">Monto</th><th className="p-3 text-center">Acciones</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-zinc-900">
                                        {trashItems.map((item, i) => (
                                            <tr key={i} className="hover:bg-zinc-900/30 group">
                                                <td className="p-3 text-zinc-500 font-mono">{item.Fecha_Compra}</td>
                                                <td className="p-3 text-zinc-300 font-medium">{item.Compra}</td>
                                                <td className="p-3 text-zinc-400">{item.Categoria}</td>
                                                <td className="p-3 text-zinc-500">{item.Cuenta_Origen}</td>
                                                <td className={`p-3 font-mono font-bold text-right ${item.Tipo_Operacion==='Ingreso'?'text-[#5dbd8c]':'text-rose-400'}`}>{formatoMoneda(Number(item.Monto_Parcial)||0)}</td>
                                                <td className="p-3 text-center">
                                                    <div className="flex gap-2 justify-center">
                                                        <button onClick={()=>restoreItem(item.ID_Unico)} disabled={restoringId===item.ID_Unico} className="text-[#5dbd8c] hover:text-white text-[9px] font-bold px-2 py-1 rounded border border-[#3d8068]/30 hover:bg-[#3d8068]/20 disabled:opacity-50">
                                                            {restoringId===item.ID_Unico ? '...' : 'Restaurar'}
                                                        </button>
                                                        {deletingId === item.ID_Unico ? (
                                                            <div className="flex gap-1">
                                                                <button onClick={()=>permanentDelete(item.ID_Unico)} className="text-rose-500 font-bold text-[9px] px-2 hover:bg-rose-500/20 rounded border border-rose-500/30">Confirmar</button>
                                                                <button onClick={()=>setDeletingId(null)} className="text-zinc-500 text-[9px] px-1 hover:bg-zinc-800 rounded">Cancelar</button>
                                                            </div>
                                                        ) : (
                                                            <button onClick={()=>setDeletingId(item.ID_Unico)} className="text-zinc-500 hover:text-rose-500 text-[9px] px-2 py-1 rounded border border-zinc-800 hover:border-rose-500/30">Eliminar</button>
                                                        )}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                    
                    <div className="glass-card p-4">
                        <p className="text-[9px] text-zinc-600">
                            <span className="text-amber-500">⚠️</span> Tips: Al eliminar una transacción desde Auditoría, se moverá aquí automáticamente. Puedes restaurarla o eliminarla permanentemente.
                        </p>
                    </div>
                </div>
            );
        });

        // === APP PRINCIPAL ===
        const App = () => {
            const [authed, setAuthed] = useState(() => localStorage.getItem('fl_auth') === '1');
            const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('fl_user') || 'josue');
            const [view, setView] = useState(() => { try { return localStorage.getItem('fl_view') || 'dash'; } catch(e) { return 'dash'; } });
            useEffect(() => { try { localStorage.setItem('fl_view', view); } catch(e) {} }, [view]);
            const [showRegistroForm, setShowRegistroForm] = useState(false);
            const [drawerOpen, setDrawerOpen] = useState(false);
            const [tagsInput, setTagsInput] = useState('');
            const [loadingInitial, setLoadingInitial] = useState(true);
            const [savingGasto, setSavingGasto] = useState(false);
            const [showSuccess, setShowSuccess] = useState(false);
            const [showOffline, setShowOffline] = useState(false);
            const [formError, setFormError] = useState('');
            
            const [viewScope, setViewScope] = useState(() => { try { return localStorage.getItem('fl_scope') || 'Compartido'; } catch(e) { return 'Compartido'; } });
            useEffect(() => { try { localStorage.setItem('fl_scope', viewScope); } catch(e) {} }, [viewScope]);

            const [isLightMode, setIsLightMode] = useState(() => localStorage.getItem('fl_theme') === 'light');
            useEffect(() => {
                if (isLightMode) document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
                localStorage.setItem('fl_theme', isLightMode ? 'light' : 'dark');
            }, [isLightMode]);
            
            const [appData, setAppData] = useState({ rawLogs: [], presupuesto: { Compartido: {}, Josue: {}, Abi: {} }, arbolCat: { Gasto: {}, Ingreso: {} }, cuentas: [] });
            const [configProporcion, setConfigProporcion] = useState({ josue: '53', abi: '47' }); 
            const [form, setForm] = useState({ id_edit: null, tipoOperacion: 'Gasto', fechaCompra: getHoyStr(), registrador: 'Josué', compra: '', monto: '', _showCalc: false, macroCategoria: '', categoria: '', cuentaOrigen: '', cuentaDestino: '', tipoGasto: 'Compartido (50/50)', msi: '1', esRecordatorio: false });

            const realLogs = useMemo(() => appData.rawLogs.filter(l => l.Es_Recordatorio !== 'TRUE'), [appData.rawLogs]);
            const reminderLogs = useMemo(() => appData.rawLogs.filter(l => l.Es_Recordatorio === 'TRUE'), [appData.rawLogs]);

            // ── Período compartido entre Auditoría y Panel ──
            const periodos = useMemo(() => [...new Set(appData.rawLogs.map(l => l.Periodo_Pago))].filter(Boolean).sort((a,b) => { try { const [da,ma,ya]=a.split('/'); const [db,mb,yb]=b.split('/'); return new Date(yb,mb-1,db)-new Date(ya,ma-1,da); } catch(e){return 0;} }), [appData.rawLogs]);
            const getPeriodoActual = () => { const hoy = new Date(); let m = hoy.getMonth(), a = hoy.getFullYear(); if (hoy.getDate() > 19) m += 1; const u = new Date(a, m + 1, 0); return `${String(u.getDate()).padStart(2,'0')}/${String(u.getMonth()+1).padStart(2,'0')}/${u.getFullYear()}`; };
            const [periodoActivo, setPeriodoActivo] = useState(() => { try { const saved = localStorage.getItem('fl_periodo'); if (saved && periodos.length > 0) { const exists = saved.split(',').some(p => periodos.includes(p)); if (exists) return saved; } return periodos.length > 0 && periodos.includes(getPeriodoActual()) ? getPeriodoActual() : (periodos[0] || getPeriodoActual()); } catch(e) { return getPeriodoActual(); } });
            // Sincronizar periodoActivo cuando periodos cambia (primer load)
            useEffect(() => { if (periodos.length > 0 && !periodos.includes(periodoActivo)) { const actual = getPeriodoActual(); setPeriodoActivo(periodos.includes(actual) ? actual : periodos[0]); } }, [periodos]);
            useEffect(() => { try { localStorage.setItem('fl_periodo', periodoActivo); } catch(e) {} }, [periodoActivo]);

            const syncOfflineQueue = async () => {
                if (!navigator.onLine) return;
                const queue = JSON.parse(localStorage.getItem('fl_offline_queue') || '[]');
                if (queue.length === 0) return;
                let pending = [];
                for (let req of queue) { try { await apiCall(req.action, req.payload); } catch (e) { pending.push(req); } }
                localStorage.setItem('fl_offline_queue', JSON.stringify(pending));
                if (pending.length === 0) loadData(); 
            };

            useEffect(() => { window.addEventListener('online', syncOfflineQueue); return () => window.removeEventListener('online', syncOfflineQueue); }, []);
            useEffect(() => { loadData(); }, []);

            const loadData = useCallback(() => {
                const cachedData = localStorage.getItem('fl_data_cache');
                if (cachedData) { setAppData(JSON.parse(cachedData)); setLoadingInitial(false); }

                if (!navigator.onLine) return setLoadingInitial(false);
                if (!cachedData) setLoadingInitial(true);
                
                apiCall('getAppData').then(data => {
                    //  Pre-enriquecer con timestamps para evitar parse en cada render
                    if (data.rawLogs) data.rawLogs = enriquecerLogs(data.rawLogs);
                    setAppData(data);
                    localStorage.setItem('fl_data_cache', JSON.stringify(data));
                    
                    if(!form.id_edit && data.cuentas.length > 0) {
                        const mCats = data.arbolCat['Gasto'] || {}; const mKey = Object.keys(mCats)[0] || '';
                        setForm(f => ({ ...f, macroCategoria: mKey, categoria: mCats[mKey]?.[0] || '', cuentaOrigen: data.cuentas[0]?.nombre || '', cuentaDestino: data.cuentas[1]?.nombre || '' }));
                    }
                    setLoadingInitial(false); syncOfflineQueue();
                }).catch(err => { setLoadingInitial(false); });
            }, [form.id_edit]);

            const triggerEdit = useCallback((log) => {
                const [d, m, y] = log.Fecha_Compra.split('/');
                let parseTipo = log.Tipo_Gasto;
                if (parseTipo && parseTipo.includes('Proporcional')) {
                    parseTipo = 'Proporcional'; const match = log.Tipo_Gasto.match(/\((\d+)\/(\d+)\)/);
                    if(match) setConfigProporcion({ josue: String(match[1]), abi: String(match[2]) });
                }
                setForm({ 
                    id_edit: log.ID_Unico, tipoOperacion: log.Tipo_Operacion || 'Gasto', fechaCompra: `${y}-${m}-${d}`, 
                    registrador: log.Registrador, compra: log.Compra, monto: log.Monto_Total, 
                    macroCategoria: log.MacroCategoria || '', categoria: log.Categoria, 
                    cuentaOrigen: log.Cuenta_Origen, cuentaDestino: log.Cuenta_Destino || '', tipoGasto: parseTipo || 'Compartido (50/50)', msi: '1',
                    esRecordatorio: log.Es_Recordatorio === 'TRUE'
                });
                setTagsInput(log.Tags || '');
                setView('registro');
            }, []);

            const saveGasto = useCallback(() => {
                if(!form.monto) { setFormError("Falta ingresar el monto total."); setTimeout(()=>setFormError(""),3000); return; }
                if(!form.compra) { setFormError("Falta ingresar la descripción."); setTimeout(()=>setFormError(""),3000); return; }

                setSavingGasto(true);
                let tipoFinal = form.tipoGasto;
                if (form.tipoOperacion === 'Gasto' && tipoFinal === 'Proporcional') tipoFinal = `Proporcional (${configProporcion.josue}/${configProporcion.abi})`;
                
                const p = { ...form, tipoGasto: tipoFinal, pctJosue: Number(configProporcion.josue)||0, pctAbi: Number(configProporcion.abi)||0, tags: tagsInput };
                const fn = form.id_edit ? 'editarGasto' : 'registrarOperacion';

                if (!navigator.onLine) {
                    const queue = JSON.parse(localStorage.getItem('fl_offline_queue') || '[]'); queue.push({ action: fn, payload: p }); localStorage.setItem('fl_offline_queue', JSON.stringify(queue));
                    setSavingGasto(false); setShowOffline(true);
                    setTimeout(() => { setShowOffline(false); setForm({ ...form, id_edit: null, compra: '', monto: '', _showCalc: false, msi: '1', esRecordatorio: false }); setTagsInput(''); }, 2000);
                    return;
                }

                apiCall(fn, p).then(() => {
                    setSavingGasto(false); setShowSuccess(true);
                    setTimeout(() => { setShowSuccess(false); setForm({ ...form, id_edit: null, compra: '', monto: '', _showCalc: false, msi: '1', esRecordatorio: false }); setTagsInput(''); loadData(); }, 1500);
                }).catch(err => { setSavingGasto(false); setFormError("Error del servidor."); setTimeout(()=>setFormError(""),3000); });
            }, [form, configProporcion]);

            const handleLogout = () => {
                localStorage.removeItem('fl_auth');
                localStorage.removeItem('fl_user');
                setAuthed(false);
            };

            if (!authed) {
                return <LoginScreen onLogin={(user) => { setAuthed(true); setCurrentUser(user); }} />;
            }

            // ── SETTINGS VIEW ──
            if (view === 'settings') {
                const SettingsPanel = () => {
                    const [spw, setSpw] = useState('');
                    const [smsg, setSmsg] = useState('');
                    const changePw = async () => {
                        if (spw.length < 3) { setSmsg('Mínimo 3 caracteres'); return; }
                        const users = USERS();
                        if (crypto.subtle) {
                            users[currentUser].hash = await sha256hex(spw);
                        } else {
                            users[currentUser].hash = 'test_' + spw;
                        }
                        saveUsers(users);
                        setSmsg('Contraseña actualizada');
                        setSpw('');
                        setTimeout(()=>setSmsg(''), 2500);
                    };
                    return (
                        <div className="glass-card p-6 max-w-lg mx-auto fade-in">
                            <h2 className="text-sm font-black uppercase text-[#5dbd8c] mb-4 flex items-center gap-2"><IconGear /> Ajustes</h2>
                            <p className="text-[11px] text-zinc-400 mb-4">Sesión: <b className="text-white uppercase">{currentUser}</b></p>

                                        </div>
                                    )}

                                    <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Descripción</label><input className="w-full p-3 rounded outline-none text-xs" placeholder="Concepto..." value={form.compra} onChange={e => setForm({...form, compra: e.target.value})} /></div>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold flex justify-between items-center">
                                                Monto Total
                                                <span className="text-[#5dbd8c] font-mono text-xs">{form.monto ? formatoMoneda(form.monto) : ''}</span>
                                            </label>
                                            <div className="flex gap-1">
                                                <input type="number" step="0.01" inputMode="decimal" className="flex-1 p-3 rounded font-mono text-lg text-white outline-none" placeholder="0.00" value={form.monto} onChange={e => setForm({...form, monto: e.target.value})} />
                                                <button type="button" onClick={() => setForm(prev => ({...prev, _showCalc: !prev._showCalc}))} className="px-3 rounded bg-zinc-900 border border-zinc-700 text-[#5dbd8c] hover:bg-zinc-800 hover:border-[#3d8068] transition-all flex items-center justify-center" title="Calculadora"><IconCalc /></button>
                                            </div>
                                            {form._showCalc && <CalcPopup onResult={(val) => setForm(prev => ({...prev, monto: String(val), _showCalc: false}))} onClose={() => setForm(prev => ({...prev, _showCalc: false}))} />}
                                        </div>
                                        <div><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Registrador</label><select className="w-full p-3 rounded text-xs outline-none" value={form.registrador} onChange={e => setForm({...form, registrador: e.target.value})}><option>Josué</option><option>Abigail</option></select></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">{form.tipoOperacion === 'Transferencia' ? 'Cuenta ORIGEN' : 'Cuenta / Método'}</label>
                                            <select className="w-full p-3 rounded text-xs outline-none" value={form.cuentaOrigen} onChange={e => setForm({...form, cuentaOrigen: e.target.value})}>{appData.cuentas.map(c=><option key={c.nombre}>{c.nombre}</option>)}</select>
                                        </div>
                                        {form.tipoOperacion === 'Transferencia' ? (
                                            <div className="fade-in"><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Cuenta DESTINO</label><select className="w-full p-3 rounded text-xs outline-none" value={form.cuentaDestino} onChange={e => setForm({...form, cuentaDestino: e.target.value})}>{appData.cuentas.map(c=><option key={c.nombre}>{c.nombre}</option>)}</select></div>
                                        ) : form.tipoOperacion === 'Gasto' ? (
                                            <div className="fade-in"><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Distribución</label><select className="w-full p-3 rounded text-xs outline-none" value={form.tipoGasto} onChange={e => setForm({...form, tipoGasto: e.target.value})}><option>Compartido (50/50)</option><option value="Proporcional">Proporcional</option><option>Personal Josué</option><option>Personal Abi</option></select></div>
                                        ) : <div/>}
                                    </div>

                                    {form.tipoOperacion === 'Gasto' && form.tipoGasto === 'Proporcional' && (
                                        <div className="grid grid-cols-2 gap-4 p-4 bg-zinc-900 rounded border border-zinc-800 fade-in">
                                            <div><label className="text-[9px] text-zinc-400 uppercase block mb-1">Josué (%)</label><input type="number" min="0" max="100" className="w-full p-2 rounded text-xs bg-black text-[#5dbd8c] font-bold outline-none" value={configProporcion.josue} onChange={e => { const val = e.target.value; setConfigProporcion({ josue: val, abi: val === '' ? '' : String(100 - Number(val)) }); }} /></div>
                                            <div><label className="text-[9px] text-zinc-400 uppercase block mb-1">Abi (%)</label><input type="number" min="0" max="100" className="w-full p-2 rounded text-xs bg-black text-[#5dbd8c] font-bold outline-none" value={configProporcion.abi} onChange={e => { const val = e.target.value; setConfigProporcion({ josue: val === '' ? '' : String(100 - Number(val)), abi: val }); }} /></div>
                                        </div>
                                    )}

                                    {!form.id_edit && form.tipoOperacion === 'Gasto' && (
                                        <div className="border-t border-zinc-800 pt-5 fade-in"><label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold flex justify-between"><span>Meses sin intereses (Opcional)</span></label><input type="number" min="1" max="24" className="w-full p-3 rounded font-mono max-w-[150px] outline-none" value={form.msi} onChange={e => setForm({...form, msi: e.target.value})} /></div>
                                    )}

                                    <div className="mt-4 fade-in">
                                        <label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Etiquetas (separadas por coma)</label>
                                        <input className="w-full p-3 rounded outline-none text-xs" placeholder="Ej: urgente, salud, ocio" value={tagsInput} onChange={e => setTagsInput(e.target.value)} />
                                    </div>

                                    <div className="bg-indigo-900/20 border border-indigo-500/30 p-4 rounded mt-4 flex items-center gap-3 cursor-pointer" onClick={() => setForm({...form, esRecordatorio: !form.esRecordatorio})}>
                                        <div className={`w-5 h-5 rounded flex items-center justify-center border transition-colors ${form.esRecordatorio ? 'bg-indigo-500 border-indigo-400' : 'bg-black border-zinc-600'}`}>
                                            {form.esRecordatorio && <span className="text-white text-xs font-bold"><IconCheck /></span>}
                                        </div>
                                        <div>
                                            <p className="text-xs font-bold text-indigo-300">Guardar como Recordatorio</p>
                                            <p className="text-[9px] text-zinc-500">No afectará tu balance hasta que lo lances a la realidad.</p>
                                        </div>
                                    </div>

                                    {formError && <div className="bg-rose-500/20 text-rose-400 border border-rose-500 p-3 rounded text-xs font-bold text-center mt-4 fade-in">{formError}</div>}

                                    <button disabled={savingGasto || showSuccess || showOffline} onClick={() => { saveGasto(); setTimeout(() => { if(!formError) { setShowRegistroForm(false); loadData(); } }, 1800); }} className={`w-full font-black p-4 rounded mt-4 uppercase tracking-[0.2em] text-xs transition-all outline-none ${form.esRecordatorio ? 'bg-indigo-500 text-white shadow-[0_0_15px_rgba(99,102,241,0.3)]' : 'bg-[#5dbd8c] text-black shadow-[0_0_15px_rgba(45,212,191,0.2)] hover:bg-white'} ${showOffline ? 'bg-amber-500 text-black shadow-none' : (showSuccess ? 'bg-[#5dbd8c] text-black shadow-none' : '')}`}>
                                        {savingGasto ? 'Sincronizando...' : (showOffline ? 'Guardado (Offline)' : (showSuccess ? '\u00a1\u00c9xito!' : (form.id_edit ? (form.esRecordatorio ? 'Actualizar Recordatorio' : 'Actualizar Operaci\u00f3n') : (form.esRecordatorio ? 'Programar Recordatorio' : 'Asentar Operaci\u00f3n'))))}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        // ── Register Service Worker (required for PWA app-drawer install on Android) ──
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => console.log('[SW] Registered. Scope:', reg.scope))
                .catch(err => console.warn('[SW] Registration failed:', err));
        }
    </script>
</body>
</html>
