<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Finance Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finance Lab">
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIiB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiI+PHJlY3Qgd2lkdGg9IjUxMiIgaGVpZ2h0PSI1MTIiIGZpbGw9IiMwNTA1MDUiLz48dGV4dCB4PSI1MCUiIHk9IjUyJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9Im1vbm9zcGFjZSIgZm9udC1zaXplPSIyMjAiIGZvbnQtd2VpZ2h0PSI5MDAiIGZpbGw9IiMyZGQ0YmYiPkZMPC90ZXh0Pjwvc3ZnPg==">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIiB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiI+PHJlY3Qgd2lkdGg9IjUxMiIgaGVpZ2h0PSI1MTIiIGZpbGw9IiMwNTA1MDUiLz48dGV4dCB4PSI1MCUiIHk9IjUyJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9Im1vbm9zcGFjZSIgZm9udC1zaXplPSIyMjAiIGZvbnQtd2VpZ2h0PSI5MDAiIGZpbGw9IiMyZGQ0YmYiPkZMPC90ZXh0Pjwvc3ZnPg==">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-top: env(safe-area-inset-top, 0px); }
        body { background: #050505; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; transition: background-color 0.3s ease, color 0.3s ease; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
        .glass-card { background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 8px; transition: background-color 0.3s ease; }
        .accent-glow { color: #2dd4bf; text-shadow: 0 0 8px rgba(45, 212, 191, 0.3); }
        input, select { background: #111 !important; border: 1px solid #222 !important; color: white !important; }
        input:focus, select:focus { border-color: #2dd4bf !important; outline: none; }
        .pie-chart { border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { height: 6px; border-radius: 3px; background: #1f1f1f; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.5s ease; }
        
        /* ── Responsive / Mobile ── */
        @media (max-width: 768px) {
            .hide-mobile { display: none !important; }
            .glass-card { border-radius: 6px; }
            input, select, button { font-size: 16px !important; }
            .grid-cols-2, .md\:grid-cols-2 { grid-template-columns: 1fr !important; }
            .grid-cols-3, .md\:grid-cols-3 { grid-template-columns: 1fr !important; }
            .grid-cols-4, .md\:grid-cols-4 { grid-template-columns: 1fr 1fr !important; }
            table { font-size: 9px !important; }
            th, td { padding: 0.35rem 0.2rem !important; }
            .p-6, .p-8, .md\:p-8 { padding: 0.75rem !important; }
            .text-2xl { font-size: 1.1rem !important; }
            .text-lg { font-size: 0.9rem !important; }
            .max-w-2xl { max-width: 100% !important; }
            .mb-8 { margin-bottom: 0.75rem !important; }
            .gap-4 { gap: 0.35rem !important; }
            .space-y-4 > * + * { margin-top: 0.5rem !important; }
            .space-y-6 > * + * { margin-top: 0.75rem !important; }
            nav button { padding: 0.4rem 0.6rem !important; font-size: 8px !important; }
            header { flex-direction: column !important; gap: 0.5rem !important; padding-bottom: 0.5rem !important; }
            .text-\[9px\], .text-\[10px\], .text-\[11px\] { font-size: 8px !important; }
            .text-\[13px\] { font-size: 10px !important; }
            .text-sm { font-size: 0.7rem !important; }
            .px-4 { padding-left: 0.5rem !important; padding-right: 0.5rem !important; }
            .py-2 { padding-top: 0.35rem !important; padding-bottom: 0.35rem !important; }
            h2 { font-size: 0.8rem !important; }
            .w-10, .h-10 { width: 2rem !important; height: 2rem !important; }
            .w-5, .h-5 { width: 1rem !important; height: 1rem !important; }
            svg.w-5 { width: 1rem !important; height: 1rem !important; }
        }
        
        /* PWA standalone: compact nav */
        @media all and (display-mode: standalone) {
            .pwa-compact { padding: 0.25rem 0.5rem !important; font-size: 9px !important; }
            .pwa-compact button { padding: 0.3rem 0.5rem !important; font-size: 8px !important; }
            .hide-standalone { display: none !important; }
        }
        
        body.light-mode { background: #f8fafc; color: #0f172a; }
        body.light-mode .glass-card { background: #ffffff; border-color: #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        body.light-mode .bg-zinc-900, body.light-mode .bg-black, body.light-mode .bg-zinc-800 { background-color: #f1f5f9 !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        body.light-mode .bg-zinc-900\/50 { background-color: #f8fafc !important; }
        body.light-mode .text-zinc-500, body.light-mode .text-zinc-400, body.light-mode .text-zinc-600 { color: #64748b !important; }
        body.light-mode .text-zinc-300, body.light-mode .text-zinc-200, body.light-mode .text-white { color: #0f172a !important; }
        body.light-mode .border-zinc-800, body.light-mode .border-zinc-700 { border-color: #e2e8f0 !important; }
        body.light-mode input, body.light-mode select { background: #ffffff !important; border: 1px solid #cbd5e1 !important; color: #0f172a !important; }
        body.light-mode .divide-zinc-900 > :not([hidden]) ~ :not([hidden]) { border-color: #e2e8f0 !important; }
        body.light-mode .hover\:bg-zinc-900\/50:hover, body.light-mode .focus-within\:bg-zinc-900\/50:focus-within { background-color: #e2e8f0 !important; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>/* SW disabled */</script>
    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef, useDeferredValue } = React;

        const API_URL = "/api";

        // ── UTILITIES ──
        const parseFechaTS = (s) => { if(!s) return 0; const p=s.split('/'); return new Date(+p[2],+p[1]-1,+p[0]).getTime(); };
        const apiCall = async (action, payload = null) => {
            try {
                const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
                const d = JSON.parse(await r.text());
                if (!d.success) throw new Error(d.error);
                return d.data;
            } catch(e) { throw new Error(e.message||"Error del Servidor."); }
        };
        const enriquecerLogs = (logs) => logs.map(l => ({...l, _sortTS: parseFechaTS(l.Fecha_Compra), _regTS: parseFechaTS(l.Fecha_Registro?.split(' ')[0]) }));
        const COLORES_PASTEL = ['#2dd4bf','#0ea5e9','#8b5cf6','#f43f5e','#f59e0b','#10b981','#3b82f6','#ec4899','#14b8a6','#6366f1'];
        const getHoyStr = () => new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().split('T')[0];
        const formatoMoneda = (num) => Number(num||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2});
        const useDebounce = (value, delay=250) => { const [debounced,setDebounced]=useState(value); useEffect(()=>{const t=setTimeout(()=>setDebounced(value),delay);return ()=>clearTimeout(t);},[value,delay]); return debounced; };

        const IconEdit = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>;
        const IconDelete = () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>;
        const IconSun = () => <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const IconMoon = () => <svg className="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>;
        const IconGear = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconLaunch = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>;

        // === PESTAÑA: RECORDATORIOS ===
        const RecordatoriosTab = React.memo(({ logs, onEdit, loadData }) => {
            const [viewScope, setViewScope] = useState('Compartido');
            const [busqueda, setBusqueda] = useState('');
            const [lanzandoId, setLanzandoId] = useState(null);
            const [deletingRecId, setDeletingRecId] = useState(null); 
            const [fechaLanzamiento, setFechaLanzamiento] = useState(getHoyStr());

            const getEstado = (fechaStr) => {
                if(!fechaStr) return { text: '', color: '' };
                const [d,m,y] = fechaStr.split('/');
                const f = new Date(y, m-1, d); const h = new Date();
                f.setHours(0,0,0,0); h.setHours(0,0,0,0);
                const diff = Math.ceil((f - h) / (1000*60*60*24));
                if (diff < 0) return { text: `Caducado (${Math.abs(diff)}d)`, color: 'text-rose-500 font-bold bg-rose-500/10 px-2 py-1 rounded' };
                if (diff === 0) return { text: '¡Vence Hoy!', color: 'text-amber-500 font-bold bg-amber-500/10 px-2 py-1 rounded' };
                if (diff === 1) return { text: 'Mañana', color: 'text-teal-400' };
                return { text: `En ${diff} días`, color: 'text-zinc-500' };
            };

            const ejecutando = (id) => { apiCall('lanzarRecordatorio', { id: id, fecha: fechaLanzamiento }).then(() => { setLanzandoId(null); loadData(); }); };

            const filteredLogs = useMemo(() => {
                let mapeados = logs.filter(l => {
                    if (l.Tipo_Operacion === 'Transferencia') {
                        if (viewScope === 'Compartido') return false; 
                        if (viewScope === 'Josue' && l.Registrador !== 'Josué') return false;
                        if (viewScope === 'Abi' && l.Registrador !== 'Abigail') return false; 
                    } else {
                        if (viewScope === 'Compartido' && l.Tipo_Gasto && l.Tipo_Gasto.includes('Personal')) return false;
                        if (viewScope === 'Josue' && !(Number(l.Participacion_Josue) > 0)) return false;
                        if (viewScope === 'Abi' && !(Number(l.Participacion_Abi) > 0)) return false;
                    }
                    return true;
                });
                if (busqueda) {
                    const q = busqueda.toLowerCase();
                    mapeados = mapeados.filter(l => Object.values(l).some(val => String(val).toLowerCase().includes(q)));
                }
                return mapeados.sort((a,b) => {
                    const pa = (s) => { const [d,m,y]=s.split('/'); return new Date(y,m-1,d).getTime(); };
                    return pa(a.Fecha_Compra) - pa(b.Fecha_Compra);
                });
            }, [logs, viewScope, busqueda]);

            return (
                <div className="space-y-6 fade-in">
                    <div className="glass-card p-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex gap-2 bg-zinc-900/50 p-1 rounded border border-zinc-800 w-full md:w-auto">
                            {['Compartido', 'Josue', 'Abi'].map(s=><button key={s} onClick={() => setViewScope(s)} className={`px-4 py-2 text-[10px] font-bold uppercase rounded flex-1 md:flex-none transition-colors ${viewScope === s ? 'bg-[#2dd4bf] text-black' : 'text-zinc-500 hover:text-white'}`}>{s==='Compartido'?'Hogar':s}</button>)}
                        </div>
                        <input className="w-full md:w-72 p-2 text-xs rounded bg-black border border-zinc-800 outline-none text-zinc-300" placeholder="🔍 Buscar recordatorio..." value={busqueda} onChange={e=>setBusqueda(e.target.value)} />
                    </div>

                    <div className="glass-card overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-[11px] whitespace-nowrap">
                                <thead className="bg-zinc-900 text-zinc-400 uppercase font-bold">
                                    <tr><th className="p-3">Programado</th><th className="p-3">Estado</th><th className="p-3">Concepto</th><th className="p-3 text-teal-400">Categoría</th><th className="p-3">Cuenta Origen</th><th className="p-3 text-right">Monto Parcial</th></tr>
                                </thead>
                                <tbody className="divide-y divide-zinc-900">
                                    {filteredLogs.map((log, idx) => {
                                        const estado = getEstado(log.Fecha_Compra);
                                        const colorFila = log.Tipo_Operacion === 'Ingreso' ? 'text-teal-400' : (log.Tipo_Operacion === 'Transferencia' ? 'text-indigo-400' : 'text-zinc-200');
                                        
                                        return (
                                            <tr key={idx} tabIndex="0" className="hover:bg-zinc-900/50 group focus-within:bg-zinc-900/50">
                                                <td className="p-3 text-zinc-500 font-mono">{log.Fecha_Compra}</td>
                                                <td className="p-3"><span className={estado.color}>{estado.text}</span></td>
                                                <td className={`p-3 font-bold ${colorFila}`}>
                                                    <div className="flex items-center gap-2">
                                                        <span>{log.Compra}</span>
                                                        <span className="text-[8px] border border-zinc-700 px-1 rounded text-zinc-500 uppercase">{log.Tipo_Operacion}</span>
                                                        <div className="opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity flex gap-2 ml-2">
                                                            <button onClick={() => onEdit(log)} className="text-zinc-500 hover:text-teal-400"><IconEdit /></button>
                                                            {deletingRecId === log.ID_Unico ? (
                                                                <div className="flex gap-1 bg-black p-1 rounded border border-rose-500/50">
                                                                    <button onClick={() => { setDeletingRecId(null); apiCall('eliminarGasto', log.ID_Unico).then(()=>loadData()); }} className="text-rose-500 px-2 font-bold text-[9px] hover:bg-rose-500/20 rounded">Eliminar</button>
                                                                    <button onClick={() => setDeletingRecId(null)} className="text-zinc-500 px-1 text-[9px] hover:bg-zinc-800 rounded">Cancelar</button>
                                                                </div>
                                                            ) : (
                                                                <button onClick={() => setDeletingRecId(log.ID_Unico)} className="text-zinc-500 hover:text-rose-500"><IconDelete /></button>
                                                            )}
                                                            <button onClick={() => { setLanzandoId(log.ID_Unico); setFechaLanzamiento(getHoyStr()); }} className="text-indigo-400 hover:text-white bg-indigo-500/20 px-2 py-1 rounded flex gap-1 items-center font-bold"><IconLaunch /> Ejecutar</button>
                                                        </div>
                                                    </div>
                                                    
                                                    {lanzandoId === log.ID_Unico && (
                                                        <div className="mt-2 p-2 bg-black rounded border border-indigo-500/50 flex gap-2 items-center fade-in max-w-sm">
                                                            <span className="text-[9px] text-indigo-300 uppercase font-bold">Lanzar con fecha:</span>
                                                            <input type="date" className="p-1 rounded text-xs bg-zinc-900 text-white outline-none" value={fechaLanzamiento} onChange={e=>setFechaLanzamiento(e.target.value)} />
                                                            <button onClick={()=>ejecutando(log.ID_Unico)} className="bg-indigo-500 text-white px-2 py-1 rounded text-xs font-bold hover:bg-indigo-400">Confirmar</button>
                                                            <button onClick={()=>setLanzandoId(null)} className="text-zinc-500 hover:text-white text-xs px-2">✕</button>
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="p-3 text-zinc-400"><span className="text-[9px] text-zinc-600 block">{log.MacroCategoria}</span>{log.Categoria}</td>
                                                <td className="p-3 text-zinc-500">{log.Cuenta_Origen} {log.Cuenta_Destino && `➔ ${log.Cuenta_Destino}`}</td>
                                                <td className="p-3 font-mono text-teal-400 text-right">{formatoMoneda(log.Monto_Parcial)}</td>
                                            </tr>
                                        );
                                    })}
                                    {filteredLogs.length === 0 && <tr><td colSpan="6" className="p-8 text-center text-zinc-600 font-mono">No hay recordatorios pendientes.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        });

        // === PESTAÑA: GESTOR DE CUENTAS ===
        const CuentasManager = React.memo(({ cuentas, logs, loadData }) => {
            const [localCuentas, setLocalCuentas] = useState(cuentas);
            const [saving, setSaving] = useState(false);
            const [form, setForm] = useState({ nombre: '', tipo: 'Activo', saldoInicial: '', propietario: 'Josué', diaCorte: '' });
            const [deletingCuenta, setDeletingCuenta] = useState(null); 

            const handleEdit = (idx, field, val) => { const updated = [...localCuentas]; updated[idx][field] = val; setLocalCuentas(updated); };
            const agregarCuenta = () => { if (!form.nombre.trim()) return; setLocalCuentas([...localCuentas, { ...form, nombre: form.nombre.trim() }]); setForm({ nombre: '', tipo: 'Activo', saldoInicial: '', propietario: 'Josué', diaCorte: '' }); };
            const eliminarCuenta = (nombre) => { setLocalCuentas(localCuentas.filter(c => c.nombre !== nombre)); setDeletingCuenta(null); };
            const guardar = () => { setSaving(true); apiCall('guardarCuentas', localCuentas).then(() => { setSaving(false); loadData(); }); };

            return (
                <div className="glass-card p-6 md:p-8 fade-in space-y-6">
                    <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                        <h2 className="text-xs font-bold uppercase tracking-widest text-zinc-500">Gestor de Cuentas</h2>
                        <button onClick={guardar} className="bg-[#2dd4bf] text-black px-6 py-2 text-[10px] font-black uppercase rounded hover:bg-white">{saving ? 'Guardando...' : 'Aplicar Cambios'}</button>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4 bg-zinc-900/50 p-4 rounded border border-zinc-800">
                        <div><label className="text-[9px] uppercase text-zinc-500 mb-1 block">Nombre</label><input className="w-full p-2 text-xs rounded bg-black" placeholder="Ej. Nu" value={form.nombre} onChange={e=>setForm({...form, nombre: e.target.value})} /></div>
                        <div><label className="text-[9px] uppercase text-zinc-500 mb-1 block">Tipo</label><select className="w-full p-2 text-xs rounded bg-black" value={form.tipo} onChange={e=>setForm({...form, tipo: e.target.value})}><option>Activo</option><option>Pasivo</option></select></div>
                        <div><label className="text-[9px] uppercase text-zinc-500 mb-1 block">Propietario</label><select className="w-full p-2 text-xs rounded bg-black" value={form.propietario} onChange={e=>setForm({...form, propietario: e.target.value})}><option>Josué</option><option>Abi</option><option>Hogar</option></select></div>
                        <div>
                            <label className="text-[9px] uppercase text-zinc-500 mb-1 block">Día Corte</label>
                            {form.tipo === 'Pasivo' ? (
                                <input type="number" className="w-full p-2 text-xs rounded bg-black" placeholder="Ej. 19" value={form.diaCorte} onChange={e=>setForm({...form, diaCorte: e.target.value})} />
                            ) : (
                                <div className="w-full p-2 text-xs rounded bg-black text-zinc-600 font-mono cursor-not-allowed text-center">N/A</div>
                            )}
                        </div>
                        <div><label className="text-[9px] uppercase text-zinc-500 mb-1 block">Inicial</label><div className="flex gap-2"><input type="number" step="0.01" className="w-full p-2 text-xs rounded bg-black font-mono text-teal-400" placeholder="0.00" value={form.saldoInicial} onChange={e=>setForm({...form, saldoInicial: e.target.value})} /><button onClick={agregarCuenta} className="bg-zinc-800 px-4 rounded text-white font-bold hover:bg-teal-500">+</button></div></div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {localCuentas.map((c, i) => {
                            let balance = Number(c.saldoInicial) || 0;
                            logs.forEach(l => {
                                const m = Number(l.Monto_Parcial) || 0;
                                if (l.Cuenta_Origen === c.nombre) {
                                    if (l.Tipo_Operacion === 'Gasto' || l.Tipo_Operacion === 'Transferencia') balance -= m;
                                    else if (l.Tipo_Operacion === 'Ingreso') balance += m;
                                }
                                if (l.Tipo_Operacion === 'Transferencia' && l.Cuenta_Destino === c.nombre) balance += m;
                            });
                            return (
                                <div key={i} tabIndex="0" className="bg-zinc-900/50 p-4 rounded border border-zinc-800 space-y-3 relative group focus-within:bg-zinc-900/80 transition-colors">
                                    {deletingCuenta === c.nombre ? (
                                        <div className="absolute top-2 right-2 flex gap-1 z-10 bg-black p-1 rounded border border-rose-500/50">
                                            <button onClick={()=>eliminarCuenta(c.nombre)} className="text-rose-500 text-[9px] font-bold px-2 hover:bg-rose-500/20 rounded">Eliminar</button>
                                            <button onClick={()=>setDeletingCuenta(null)} className="text-zinc-500 text-[9px] px-2 hover:bg-zinc-800 rounded">Cancelar</button>
                                        </div>
                                    ) : (
                                        <button onClick={()=>setDeletingCuenta(c.nombre)} className="absolute top-2 right-2 text-zinc-600 hover:text-rose-500 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity"><IconDelete /></button>
                                    )}

                                    <div className="flex justify-between pr-4">
                                        <input className="bg-transparent font-bold text-teal-400 outline-none w-1/2" value={c.nombre} onChange={e=>handleEdit(i, 'nombre', e.target.value)} />
                                        <div className="flex flex-col items-end">
                                            <select className="bg-transparent text-[9px] uppercase text-zinc-500 text-right outline-none" value={c.propietario} onChange={e=>handleEdit(i, 'propietario', e.target.value)}><option>Josué</option><option>Abi</option><option>Hogar</option></select>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="flex-1"><label className="text-[8px] text-zinc-600 block uppercase">Inicial</label><input type="number" step="0.01" className="bg-transparent font-mono text-sm w-full border-b border-zinc-800 outline-none" value={c.saldoInicial} onChange={e=>handleEdit(i, 'saldoInicial', e.target.value)} /></div>
                                        <div className="flex-1"><label className="text-[8px] text-zinc-600 block uppercase">Corte</label>
                                            {c.tipo.trim() === 'Pasivo' ? <input type="number" className="bg-transparent font-mono text-sm w-full border-b border-zinc-800 outline-none" value={c.diaCorte} onChange={e=>handleEdit(i, 'diaCorte', e.target.value)} /> : <span className="font-mono text-sm text-zinc-500 block mt-1">N/A</span>}
                                        </div>
                                    </div>
                                    <div className="border-t border-zinc-800 pt-2 flex justify-between items-center">
                                        <span className={`text-[8px] uppercase px-2 py-1 rounded ${c.tipo.trim()==='Pasivo'?'bg-rose-500/20 text-rose-400':'bg-teal-500/20 text-teal-400'}`}>{c.tipo}</span>
                                        <p className={`font-mono font-bold text-lg ${c.tipo.trim()==='Pasivo'?'text-rose-400':'text-zinc-800'}`}>{formatoMoneda(c.tipo.trim()==='Pasivo' ? balance * -1 : balance)}</p>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        });

        // === PESTAÑA: TABLERO ===
        const Dashboard = React.memo(({ rawLogs, presupuesto, cuentas, onEdit }) => {
            const [viewScope, setViewScope] = useState('Compartido');
            const [deletingLog, setDeletingLog] = useState(null);
            const [tablaFiltroTipo, setTablaFiltroTipo] = useState('Gasto');
            const [busqueda, setBusqueda] = useState('');
            const busquedaDebounced = useDebounce(busqueda, 250);
            const [filtroCategorias, setFiltroCategorias] = useState([]);

            const mapCuentas = useMemo(() => { let map = {}; cuentas.forEach(c => map[c.nombre] = c.propietario); return map; }, [cuentas]);
            const periodos = useMemo(() => [...new Set(rawLogs.map(l => l.Periodo_Pago))].filter(Boolean).sort((a, b) => { try { const pA = String(a).split('/'); const pB = String(b).split('/'); return new Date(pB[2], pB[1]-1, pB[0]) - new Date(pA[2], pA[1]-1, pA[0]); } catch(e) { return 0; } }), [rawLogs]);
            const getPeriodoActual = () => { const hoy = new Date(); let m = hoy.getMonth(), a = hoy.getFullYear(); if (hoy.getDate() > 19) m += 1; const u = new Date(a, m + 1, 0); return `${String(u.getDate()).padStart(2, '0')}/${String(u.getMonth() + 1).padStart(2, '0')}/${u.getFullYear()}`; };
            const [periodoActivo, setPeriodoActivo] = useState(periodos.includes(getPeriodoActual()) ? getPeriodoActual() : (periodos[0] || getPeriodoActual()));
            
            const [hiddenTipos, setHiddenTipos] = useState([]);
            useEffect(() => { setHiddenTipos([]); setFiltroCategorias([]); }, [viewScope, periodoActivo]);

            const logsGlobal = useMemo(() => rawLogs.filter(l => l.Periodo_Pago === periodoActivo), [rawLogs, periodoActivo]);
            const logsGrafico = useMemo(() => logsGlobal.filter(l => {
                if (l.Tipo_Operacion === 'Transferencia' || l.Tipo_Operacion === 'Ingreso') return false; 
                if (viewScope === 'Compartido') return !l.Tipo_Gasto.includes('Personal');
                if (viewScope === 'Josue') return Number(l.Participacion_Josue) > 0;
                if (viewScope === 'Abi') return Number(l.Participacion_Abi) > 0;
                if (filtroCategorias.length > 0 && !filtroCategorias.includes(l.Categoria)) return false;
                return false;
            }), [logsGlobal, viewScope, filtroCategorias]);

            const availableTipos = useMemo(() => [...new Set(logsGrafico.map(l => l.Tipo_Gasto))], [logsGrafico]);
            const logsGraficoFiltrado = useMemo(() => logsGrafico.filter(l => !hiddenTipos.includes(l.Tipo_Gasto)), [logsGrafico, hiddenTipos]);

            const tablaLogs = useMemo(() => {
                let mapeados = logsGlobal.filter(l => {
                    if (tablaFiltroTipo !== 'Todos' && l.Tipo_Operacion !== tablaFiltroTipo) return false;
                    if (l.Tipo_Operacion !== 'Transferencia') {
                        if (viewScope === 'Compartido' && l.Tipo_Gasto && l.Tipo_Gasto.includes('Personal')) return false;
                        if (viewScope === 'Josue' && !(Number(l.Participacion_Josue) > 0)) return false;
                        if (viewScope === 'Abi' && !(Number(l.Participacion_Abi) > 0)) return false;
                    }
                    if (filtroCategorias.length > 0 && !filtroCategorias.includes(l.Categoria)) return false;
                    return true;
                });

                if (busquedaDebounced.trim() !== '') {
                    const q = busquedaDebounced.toLowerCase();
                    mapeados = mapeados.filter(l => 
                        (l.Compra && l.Compra.toLowerCase().includes(q)) || (l.Categoria && l.Categoria.toLowerCase().includes(q)) ||
                        (l.MacroCategoria && l.MacroCategoria.toLowerCase().includes(q)) || (l.Cuenta_Origen && l.Cuenta_Origen.toLowerCase().includes(q)) ||
                        (l.Cuenta_Destino && l.Cuenta_Destino.toLowerCase().includes(q)) || (l.Fecha_Compra && l.Fecha_Compra.includes(q)) ||
                        (l.Monto_Total && String(l.Monto_Total).includes(q))
                    );
                }
                return mapeados;
            }, [logsGlobal, tablaFiltroTipo, viewScope, busquedaDebounced, filtroCategorias]);

            const deudaAbi = logsGlobal.reduce((acc, curr) => {
                const monto = Number(curr.Monto_Parcial) || 0;
                if (curr.Tipo_Operacion === 'Transferencia') {
                    if (mapCuentas[curr.Cuenta_Origen] === 'Abi' && mapCuentas[curr.Cuenta_Destino] === 'Josué') return acc - monto;
                    if (mapCuentas[curr.Cuenta_Origen] === 'Josué' && mapCuentas[curr.Cuenta_Destino] === 'Abi') return acc + monto;
                    return acc;
                }
                if (curr.Tipo_Operacion === 'Gasto') {
                    const pJ = Number(curr.Participacion_Josue) || 0, pA = Number(curr.Participacion_Abi) || 0;
                    const prop = mapCuentas[curr.Cuenta_Origen];
                    if (prop === 'Josué') return acc + pA;
                    if (prop === 'Abi') return acc - pJ;
                }
                return acc;
            }, 0);

            const totalGastoView = logsGraficoFiltrado.reduce((acc, l) => acc + (viewScope === 'Compartido' ? Number(l.Monto_Parcial) : (viewScope === 'Josue' ? Number(l.Participacion_Josue) : Number(l.Participacion_Abi))), 0);

            const categoriasData = useMemo(() => {
                let map = {};
                logsGraficoFiltrado.forEach(l => {
                    let amt = viewScope === 'Compartido' ? Number(l.Monto_Parcial) : (viewScope === 'Josue' ? Number(l.Participacion_Josue) : Number(l.Participacion_Abi));
                    if (amt > 0) map[l.Categoria] = (map[l.Categoria] || 0) + amt;
                });
                return Object.keys(map).map(k => ({ nombre: k, total: map[k] })).sort((a,b) => b.total - a.total);
            }, [logsGraficoFiltrado, viewScope]);

            const currentPresupuesto = presupuesto[viewScope] || {};
            const categoriasParaRender = useMemo(() => {
                let cats = [...categoriasData]; 
                Object.keys(currentPresupuesto).forEach(catName => { if (currentPresupuesto[catName] > 0 && !cats.find(c => c.nombre === catName)) cats.push({ nombre: catName, total: 0 }); });
                return cats;
            }, [categoriasData, currentPresupuesto]);

            // ── Tendencia 6 meses (local, respeta scope) ──
            const mesesNombres = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            const tendenciaData = useMemo(() => {
                // Generate last 6 periodos from periodoActivo
                const [d,m,y] = periodoActivo.split('/');
                let cur = new Date(y, m-1, d);
                const periods = [];
                for (let i = 0; i < 6; i++) {
                    const label = `${mesesNombres[cur.getMonth()]} ${cur.getFullYear()}`;
                    const lastDay = new Date(cur.getFullYear(), cur.getMonth()+1, 0);
                    const periodoKey = `${String(lastDay.getDate()).padStart(2,'0')}/${String(lastDay.getMonth()+1).padStart(2,'0')}/${lastDay.getFullYear()}`;
                    periods.push({ label, periodoKey, date: new Date(cur) });
                    // Go to previous month
                    cur = new Date(cur.getFullYear(), cur.getMonth(), 0);
                }
                periods.reverse();
                return periods.map(p => {
                    const logs = rawLogs.filter(l => {
                        if (l.Periodo_Pago !== p.periodoKey) return false;
                        if (l.Tipo_Operacion === 'Transferencia') return false;
                        if (viewScope === 'Compartido') return !(l.Tipo_Gasto && l.Tipo_Gasto.includes('Personal'));
                        if (viewScope === 'Josue') return Number(l.Participacion_Josue) > 0;
                        if (viewScope === 'Abi') return Number(l.Participacion_Abi) > 0;
                        if (filtroCategorias.length > 0 && !filtroCategorias.includes(l.Categoria)) return false;
                        if (tablaFiltroTipo === 'Gasto' && l.Tipo_Operacion !== 'Gasto') return false;
                        if (tablaFiltroTipo === 'Ingreso' && l.Tipo_Operacion !== 'Ingreso') return false;
                        if (tablaFiltroTipo === 'Transferencia') return false;
                        return true;
                    });
                    let gastos = 0, ingresos = 0;
                    logs.forEach(l => {
                        const amt = viewScope === 'Compartido' ? Number(l.Monto_Parcial) : (viewScope === 'Josue' ? Number(l.Participacion_Josue) : Number(l.Participacion_Abi));
                        if (l.Tipo_Operacion === 'Ingreso') ingresos += amt;
                        else gastos += amt;
                    });
                    return { label: p.label, gastos, ingresos, neto: ingresos - gastos };
                });
            }, [rawLogs, periodoActivo, viewScope, filtroCategorias, tablaFiltroTipo]);

            // ── Pie chart click state ──
            const [pieSelected, setPieSelected] = useState(null);

            // ── SVG Donut segments ──
            const pieSegments = useMemo(() => {
                if (categoriasData.length === 0 || totalGastoView === 0) return [];
                let startAngle = -Math.PI / 2;
                return categoriasData.map((cat, i) => {
                    const pct = cat.total / totalGastoView;
                    const angle = pct * 2 * Math.PI;
                    const endAngle = startAngle + angle;
                    const result = { ...cat, pct, color: COLORES_PASTEL[i % COLORES_PASTEL.length], startAngle, endAngle };
                    startAngle = endAngle;
                    return result;
                });
            }, [categoriasData, totalGastoView]);

            const [sortConfig, setSortConfig] = useState({ key: 'Fecha_Compra', direction: 'desc' });
            const [pageSize, setPageSize] = useState(20);
            const [currentPage, setCurrentPage] = useState(1);
            const [showTrendGasto, setShowTrendGasto] = useState(true);
            const [showTrendIngreso, setShowTrendIngreso] = useState(false);
            const [showTrendNeto, setShowTrendNeto] = useState(false);

            useEffect(() => { setCurrentPage(1); }, [tablaLogs.length, sortConfig, pageSize]);
            
            const requestSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const sortedLogs = useMemo(() => {
                let sortableItems = [...tablaLogs];
                sortableItems.sort((a, b) => {
                    let valA, valB;
                    if (sortConfig.key === 'Fecha_Compra') {
                        valA = a._sortTS || 0; valB = b._sortTS || 0;
                        if (valA === valB) {
                            const ta = a._regTS || 0, tb = b._regTS || 0;
                            if (ta !== tb) return sortConfig.direction === 'asc' ? ta - tb : tb - ta;
                        }
                    } else if (sortConfig.key === 'Aporte') {
                        valA = viewScope === 'Compartido' ? Number(a.Monto_Parcial) : (viewScope === 'Josue' ? Number(a.Participacion_Josue) : Number(a.Participacion_Abi));
                        valB = viewScope === 'Compartido' ? Number(b.Monto_Parcial) : (viewScope === 'Josue' ? Number(b.Participacion_Josue) : Number(b.Participacion_Abi));
                    } else if (sortConfig.key === 'Monto_Total') {
                        valA = Number(a.Monto_Total) || 0; valB = Number(b.Monto_Total) || 0;
                    } else {
                        valA = String(a[sortConfig.key] || '').toLowerCase();
                        valB = String(b[sortConfig.key] || '').toLowerCase();
                    }
                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                return sortableItems;
            }, [tablaLogs, sortConfig, viewScope]);

            return (
                <div className="space-y-6 fade-in">
                    <div className="glass-card p-4 flex flex-col gap-3">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex gap-2 bg-zinc-900/50 p-1 rounded border border-zinc-800 w-full md:w-auto">
                                {['Compartido', 'Josue', 'Abi'].map(s=><button key={s} onClick={() => setViewScope(s)} className={`px-4 py-2 text-[10px] font-bold uppercase rounded flex-1 md:flex-none transition-colors ${viewScope === s ? 'bg-[#2dd4bf] text-black' : 'text-zinc-500 hover:text-white'}`}>{s==='Compartido'?'Hogar':s}</button>)}
                            </div>
                            <div className="flex items-center gap-3 w-full md:w-auto">
                                <span className="text-[10px] uppercase tracking-widest text-zinc-500 font-bold whitespace-nowrap">Corte Operativo</span>
                                <select className="p-2 text-sm bg-zinc-900 rounded border border-zinc-800 w-full md:w-auto outline-none text-teal-400 font-bold" value={periodoActivo} onChange={e => setPeriodoActivo(e.target.value)}>
                                    {periodos.length === 0 && <option>{periodoActivo}</option>}
                                    {periodos.map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>
                        </div>
                        {availableTipos.length > 0 && (
                            <div className="border-t border-zinc-800/50 pt-3 flex flex-wrap gap-2 items-center fade-in">
                                {availableTipos.map(tipo => {
                                    const isActive = !hiddenTipos.includes(tipo);
                                    return <button key={tipo} onClick={() => { if (isActive) setHiddenTipos([...hiddenTipos, tipo]); else setHiddenTipos(hiddenTipos.filter(t => t !== tipo)); }} className={`px-3 py-1 text-[9px] font-bold uppercase rounded-full transition-all border ${isActive ? 'bg-[#2dd4bf]/10 border-[#2dd4bf]/50 text-[#2dd4bf]' : 'bg-transparent border-zinc-800 text-zinc-600'}`}>{tipo}</button>
                                })}
                            </div>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="glass-card p-6">
                            <p className="text-[10px] text-zinc-500 uppercase tracking-widest">Gasto {viewScope}</p>
                            <p className="text-3xl font-bold accent-glow mt-1">{formatoMoneda(totalGastoView)}</p>
                        </div>
                        {viewScope === 'Compartido' ? (
                            <div className={`glass-card p-6 border-l-4 ${Math.abs(deudaAbi) < 0.01 ? 'border-teal-500' : 'border-amber-500'}`}>
                                <p className="text-[10px] text-zinc-500 uppercase tracking-widest">Balance Neto (Hogar)</p>
                                <p className={`text-2xl font-bold mt-1 text-white`}>{Math.abs(deudaAbi) < 0.01 ? 'Saldado ✓' : `${deudaAbi > 0 ? '+' : ''}${formatoMoneda(deudaAbi)}`}</p>
                            </div>
                        ) : (
                            <div className={`glass-card p-6 border-l-4 ${Math.abs(deudaAbi) < 0.01 ? 'border-teal-500' : ((viewScope === 'Josue' && deudaAbi > 0) || (viewScope === 'Abi' && deudaAbi < 0) ? 'border-teal-500' : 'border-rose-500')}`}>
                                <p className="text-[10px] text-zinc-500 uppercase tracking-widest">Tu Balance</p>
                                <p className={`text-2xl font-bold mt-1 ${Math.abs(deudaAbi) < 0.01 ? 'text-white' : ((viewScope === 'Josue' && deudaAbi > 0) || (viewScope === 'Abi' && deudaAbi < 0) ? 'text-teal-400' : 'text-rose-400')}`}>
                                    {Math.abs(deudaAbi) < 0.01 ? 'Estás al día ✓' : (
                                        (viewScope === 'Josue' && deudaAbi > 0) ? `Abi te debe ${formatoMoneda(deudaAbi)}` :
                                        (viewScope === 'Josue' && deudaAbi < 0) ? `Le debes a Abi ${formatoMoneda(Math.abs(deudaAbi))}` :
                                        (viewScope === 'Abi' && deudaAbi > 0) ? `Le debes a Josué ${formatoMoneda(deudaAbi)}` :
                                        `Josué te debe ${formatoMoneda(Math.abs(deudaAbi))}`
                                    )}
                                </p>
                            </div>
                        )}
                    </div>

                    {/* ── Donut interactivo + Categorías ── */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="glass-card p-6 flex flex-col items-center">
                            <h3 className="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-4 w-full text-left flex items-center gap-2 flex-wrap">
                                Distribución de Gastos
                                {filtroCategorias.length > 0 && (
                                    <button onClick={() => { setFiltroCategorias([]); setPieSelected(null); }} className="text-[9px] bg-teal-500/20 text-teal-400 px-2 py-0.5 rounded hover:bg-rose-500/20 hover:text-rose-400 transition-colors">
                                        ✕ {filtroCategorias.length} selecc.
                                    </button>
                                )}
                            </h3>
                            {categoriasData.length === 0 || totalGastoView === 0 ? (
                                <div className="w-48 h-48 md:w-56 md:h-56 rounded-full flex items-center justify-center" style={{background:'#111'}}>
                                    <span className="text-zinc-600 text-xs">Sin datos</span>
                                </div>
                            ) : (
                                <div className="relative">
                                    <svg viewBox="0 0 200 200" className="w-48 h-48 md:w-56 md:h-56 cursor-pointer" style={{filter:'drop-shadow(0 0 12px rgba(0,0,0,0.5))'}}>
                                        {pieSegments.map((seg, i) => {
                                            const isActive = filtroCategorias.length === 0 || filtroCategorias.includes(seg.nombre);
                                            const isDimmed = filtroCategorias.length > 0 && !filtroCategorias.includes(seg.nombre);
                                            const R_o = 90, R_i = 50, cx = 100, cy = 100;
                                            const a1 = seg.startAngle, a2 = seg.endAngle;
                                            const x1o = cx + R_o * Math.cos(a1), y1o = cy + R_o * Math.sin(a1);
                                            const x2o = cx + R_o * Math.cos(a2), y2o = cy + R_o * Math.sin(a2);
                                            const x1i = cx + R_i * Math.cos(a1), y1i = cy + R_i * Math.sin(a1);
                                            const x2i = cx + R_i * Math.cos(a2), y2i = cy + R_i * Math.sin(a2);
                                            const la = (a2 - a1) > Math.PI ? 1 : 0;
                                            const donutPath = `M ${x1o} ${y1o} A ${R_o} ${R_o} 0 ${la} 1 ${x2o} ${y2o} L ${x2i} ${y2i} A ${R_i} ${R_i} 0 ${la} 0 ${x1i} ${y1i} Z`;
                                            return (
                                                <g key={i}>
                                                    <path
                                                        d={donutPath}
                                                        fill={isDimmed ? seg.color + '33' : seg.color}
                                                        stroke="#050505" strokeWidth="1.5"
                                                        style={{transition:'fill 0.25s ease, opacity 0.25s ease', opacity: isDimmed ? 0.35 : 1}}
                                                        onClick={() => {
                                                            setFiltroCategorias(prev => prev.includes(seg.nombre) ? prev.filter(c => c !== seg.nombre) : [...prev, seg.nombre]);
                                                            setPieSelected(pieSelected === i ? null : i);
                                                            if (tablaFiltroTipo !== 'Gasto' && tablaFiltroTipo !== 'Todos') setTablaFiltroTipo('Gasto');
                                                        }}
                                                        onMouseEnter={() => setPieSelected(pieSelected === i ? null : i)}
                                                        onMouseLeave={() => setPieSelected(prev => prev === i ? null : prev)}
                                                    />
                                                </g>
                                            );
                                        })}
                                        <circle cx="100" cy="100" r="48" fill="#0a0a0a" stroke="#1a1a1a" strokeWidth="1" />
                                        {filtroCategorias.length === 1 && pieSegments.find(s => s.nombre === filtroCategorias[0]) ? (() => {
                                            const sel = pieSegments.find(s => s.nombre === filtroCategorias[0]);
                                            return (
                                                <>

                                                if (showTrendIngreso) allLabels.push({ x, dotY: TOP + yScale(d.ingresos), val: d.ingresos, color: '#22c55e', key: 'i'+i });
                                                if (showTrendNeto) allLabels.push({ x, dotY: TOP + yScale(d.neto), val: d.neto, color: '#3b82f6', key: 'n'+i });
                                            });
                                            const groups = {};
                                            allLabels.forEach(l => { if (!groups[l.x]) groups[l.x] = []; groups[l.x].push(l); });
                                            const positioned = [];
                                            Object.values(groups).forEach(group => {
                                                group.sort((a,b) => a.dotY - b.dotY);

                                    </svg>

                    apiCall('agregarCategoriaMaster', {name, macro, tipo: formNew.tipo}).then(()=>loadData()); 
                    setFormNew({ ...formNew, nombre: '', macro: '' }); 
                }

        // ── HASH UTILS ──
        const sha256hex = async (txt) => {
            if (crypto.subtle) {
                const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
                return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
            }
            // Fallback for HTTP (test env): simple hash
            let hash = 0; for(let i=0;i<txt.length;i++){hash=((hash<<5)-hash)+txt.charCodeAt(i);hash|=0;}
            return 'fallback_'+Math.abs(hash).toString(16);
        };
        const USERS = () => { try { return JSON.parse(localStorage.getItem('fl_users') || '{}'); } catch(e) { return {}; } };
        const saveUsers = (u) => localStorage.setItem('fl_users', JSON.stringify(u));
        
        // Init default users on first load

            saveUsers({

                abi: { hash: '0c1a70e4512ee6f78c92820756a4026ce1f93872369624f31cf206614b2e231f', pregunta: '¿Ciudad donde nos conocimos?', respuesta: 'da4612572bc9fefbf89a091032f912bb8883727e73ee8820066d24fe43caafe3' }

        }

        // === PANTALLA DE LOGIN ===
        const LoginScreen = ({ onLogin }) => {
            const [user, setUser] = useState(localStorage.getItem('fl_lastuser') || '');

            const handleLogin = async (e) => {

                if (!u) { setError('Usuario no encontrado'); setLoading(false); return; }
                let valid = false;
                if (crypto.subtle) {
                    const hash = await sha256hex(pw);
                    valid = (hash === u.hash);
                } else {
                    // Test env (HTTP): plaintext comparison
                    valid = (pw === '3113' && user === 'josue') || (pw === '1309' && user === 'abi');

                if (valid) {

            const verifyRecovery = async () => {
                const users = USERS();
                const u = users[recoveryUser];
                let valid = false;
                if (crypto.subtle) {
                    const ansHash = await sha256hex(recoveryAnswer.toLowerCase().trim());
                    valid = (ansHash === u.respuesta);
                } else {
                    valid = (recoveryAnswer.toLowerCase().trim() === 'cdmx');
                }
                if (valid) {

                }

            const saveNewPassword = async () => {
                if (recoveryNewPw.length < 3) { setError('Mínimo 3 caracteres'); return; }
                const users = USERS();
                if (crypto.subtle) {
                    users[recoveryUser].hash = await sha256hex(recoveryNewPw);
                } else {
                    // Test env: store plaintext
                    users[recoveryUser].hash = 'test_' + recoveryNewPw;
                }
                saveUsers(users);
                setForgotView(false);
                setRecoveryStep(0);
                setError('');
                alert('✅ Contraseña actualizada. Ya puedes iniciar sesión.');

            if (forgotView) {

                                    {error && <div className="bg-rose-500/20 text-rose-400 border border-rose-500 p-2 rounded text-xs text-center">{error}</div>}
                                    <button onClick={verifyRecovery} className="w-full bg-teal-500 text-black font-black p-3 rounded uppercase text-xs">Verificar</button>

                                    {error && <div className="bg-rose-500/20 text-rose-400 border border-rose-500 p-2 rounded text-xs text-center">{error}</div>}

                            )}

                );
            }

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="glass-card p-6 max-w-sm w-full fade-in">

                            </div>
                            {error && <div className="bg-rose-500/20 text-rose-400 border border-rose-500 p-2 rounded text-xs font-bold text-center">{error}</div>}
