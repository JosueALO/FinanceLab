            const balanceAJ = useMemo(() => {
                return rawLogs.filter(l => l.Periodo_Pago === periodoActivo && l.Es_Recordatorio !== 'TRUE').reduce((acc, curr) => {
                    const monto = Number(curr.Monto_Parcial) || 0;
                    if (curr.Tipo_Operacion === 'Transferencia') {
                        const propO = mapCuentas[curr.Cuenta_Origen];
                        const propD = mapCuentas[curr.Cuenta_Destino];
                        if (mismoProp(propO, 'Abi') && mismoProp(propD, 'Josue')) return acc - monto;
                        if (mismoProp(propO, 'Josue') && mismoProp(propD, 'Abi')) return acc + monto;
                        return acc;
                    }
                    if (curr.Tipo_Operacion === 'Gasto') {
                        const pJ = Number(curr.Participacion_Josue) || 0, pA = Number(curr.Participacion_Abi) || 0;
                        const prop = mapCuentas[curr.Cuenta_Origen];
                        if (mismoProp(prop, 'Josue')) return acc + pA;
                        if (mismoProp(prop, 'Abi')) return acc - pJ;
                    }
                    return acc;
                }, 0);
            }, [rawLogs, periodoActivo, mapCuentas]);

            // ── Balance AJ Acumulado ──
            const balanceAJAcum = useMemo(() => {
                const parseP = (p) => { const [d,m,y] = p.split('/').map(Number); return new Date(y, m-1, d); };
                const fechaActivo = parseP(periodoActivo);
                const periodosHasta = [...periodos]
                    .filter(p => parseP(p) <= fechaActivo)
                    .sort((a,b) => parseP(a) - parseP(b));
                return periodosHasta.reduce((acc, p) => {
                    return rawLogs.filter(l => l.Periodo_Pago === p && l.Es_Recordatorio !== 'TRUE').reduce((inner, curr) => {
                        const monto = Number(curr.Monto_Parcial) || 0;
                        if (curr.Tipo_Operacion === 'Transferencia') {
                            const propO = mapCuentas[curr.Cuenta_Origen];
                            const propD = mapCuentas[curr.Cuenta_Destino];
                            if (mismoProp(propO, 'Abi') && mismoProp(propD, 'Josue')) return inner - monto;
                            if (mismoProp(propO, 'Josue') && mismoProp(propD, 'Abi')) return inner + monto;
                            return inner;
                        }
                        if (curr.Tipo_Operacion === 'Gasto') {
                            const pJ = Number(curr.Participacion_Josue) || 0, pA = Number(curr.Participacion_Abi) || 0;
                            const prop = mapCuentas[curr.Cuenta_Origen];
                            if (mismoProp(prop, 'Josue')) return inner + pA;
                            if (mismoProp(prop, 'Abi')) return inner - pJ;
                        }
                        return inner;
                    }, acc);
                }, 0);
            }, [rawLogs, periodoActivo, periodos, mapCuentas]);

            // ── Δ Patrimonio (cambio neto del período) ──
            const deltaPatrimonio = useMemo(() => {
                const parseP = (p) => { const [d,m,y] = p.split('/').map(Number); return new Date(y, m-1, d); };
                const fechaActivo = parseP(periodoActivo);
                const periodosPrevios = [...periodos]
                    .filter(p => parseP(p) < fechaActivo)
                    .sort((a,b) => parseP(a) - parseP(b));
                const cuentasScope = viewScope === 'Compartido'
                    ? cuentas
                    : cuentas.filter(c => mismoProp(c.propietario, viewScope));
                if (cuentasScope.length === 0) return 0;
                const balances = {};
                cuentasScope.forEach(c => { balances[c.nombre] = Number(c.saldoInicial) || 0; });
                periodosPrevios.forEach(p => {
                    rawLogs.filter(l => l.Periodo_Pago === p).forEach(l => {
                        const m = Number(l.Monto_Parcial) || 0;
                        if (l.Cuenta_Origen && balances[l.Cuenta_Origen] !== undefined) {
                            if (l.Tipo_Operacion === 'Gasto' || l.Tipo_Operacion === 'Transferencia') balances[l.Cuenta_Origen] -= m;
                            else if (l.Tipo_Operacion === 'Ingreso') balances[l.Cuenta_Origen] += m;
                        }
                        if (l.Cuenta_Destino && l.Tipo_Operacion === 'Transferencia' && balances[l.Cuenta_Destino] !== undefined) balances[l.Cuenta_Destino] += m;
                    });
                });
                let prevActivo = 0, prevPasivo = 0, prevNetoReal = 0;
                cuentasScope.forEach(c => {
                    const bal = balances[c.nombre] || 0;
                    if (c.tipo && c.tipo.trim() === 'Activo') { prevActivo += Math.max(0, bal); prevNetoReal += bal; }
                    else if (c.tipo && c.tipo.trim() === 'Pasivo') { prevPasivo += Math.max(0, -bal); prevNetoReal += bal; }
                });
                const prevPatrimonio = viewScope === 'Compartido' ? (prevActivo - prevPasivo) : prevNetoReal;
                return balanceScope.patrimonio - prevPatrimonio;
            }, [cuentas, rawLogs, periodoActivo, viewScope, periodos, balanceScope.patrimonio]);

            // ── Recent Transactions ── removed

            return (
                <div className="space-y-4 fade-in pb-20">
                    {/* ── Header: Scope + Period ── */}
                    <div className="glass-card p-4 flex flex-col gap-3">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex gap-2 bg-zinc-900/50 p-1 rounded border border-zinc-800 w-full md:w-auto">

                            </div>
                            <div className="flex items-center gap-3 w-full md:w-auto">
                                <PeriodSelector periodos={periodos} periodoActivo={periodoActivo} setPeriodoActivo={setPeriodoActivo} getPeriodoActual={getPeriodoActual} label="Corte" />

                    {/* ── Card 1: Balance Summary ── */}
                    <div className="glass-card p-5">

                            <button onClick={()=>{setBalanceModo(balanceModo==='periodo'?'acumulado':'periodo');setBalanceTooltip(null)}} className="flex items-center gap-0 bg-zinc-900 border border-zinc-800 rounded-full p-0.5 transition-colors hover:border-zinc-700" title={balanceModo==='periodo'?'Cambiar a vista Acumulada':'Cambiar a vista del Período'}>
                                <span className={`px-2.5 py-1 rounded-full text-[9px] font-bold uppercase transition-all flex items-center gap-1 ${balanceModo==='periodo'?'bg-[#5dbd8c] text-black':'text-zinc-500'}`}>
                                    <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                    Período
                                </span>
                                <span className={`px-2.5 py-1 rounded-full text-[9px] font-bold uppercase transition-all flex items-center gap-1 ${balanceModo==='acumulado'?'bg-[#5dbd8c] text-black':'text-zinc-500'}`}>
                                    <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                                    Acum.
                                </span>
                            </button>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            {balanceModo === 'periodo' ? (<>
                                <div className="relative">
                                    <p className="text-[9px] text-zinc-600 uppercase cursor-pointer hover:text-white transition-colors inline-flex items-center gap-1" onClick={()=>setBalanceTooltip(balanceTooltip==='ingreso'?null:'ingreso')}>
                                        Ingreso <span className="text-[8px] text-zinc-700">{balanceTooltip==='ingreso'?'▲':'▼'}</span>
                                    </p>
                                    {balanceTooltip==='ingreso' && (<div className="absolute top-full left-0 mt-1 w-52 bg-zinc-800 text-zinc-300 text-[8px] rounded p-2.5 border border-zinc-700 shadow-xl z-30 fade-in leading-relaxed">Dinero que entró a tus cuentas este corte. Hogar suma todos los ingresos no personales; Josué/Abi solo los recibidos en sus propias cuentas. No se dividen: cada peso va al dueño de la cuenta. Verde = entrada de dinero.</div>)}
                                    <p className="text-2xl font-bold text-[#5dbd8c] mt-1">{formatoMoneda(ingresosPeriodo)}</p>
                                </div>
                                <div className="relative">
                                    <p className="text-[9px] text-zinc-600 uppercase cursor-pointer hover:text-white transition-colors inline-flex items-center gap-1" onClick={()=>setBalanceTooltip(balanceTooltip==='gasto'?null:'gasto')}>
                                        Gasto <span className="text-[8px] text-zinc-700">{balanceTooltip==='gasto'?'▲':'▼'}</span>
                                    </p>
                                    {balanceTooltip==='gasto' && (<div className="absolute top-full left-0 mt-1 w-52 bg-zinc-800 text-zinc-300 text-[8px] rounded p-2.5 border border-zinc-700 shadow-xl z-30 fade-in leading-relaxed">Total de gastos de este corte (sin transferencias). Hogar: suma todos los gastos compartidos, excluye los personales. Josué/Abi: solo tu participación en cada gasto. Rojo = salida de dinero.</div>)}
                                    <p className="text-2xl font-bold text-rose-400 mt-1">{formatoMoneda(totalScope)}</p>
                                </div>
                                <div className="relative">
                                    <p className="text-[9px] text-zinc-600 uppercase cursor-pointer hover:text-white transition-colors inline-flex items-center gap-1" onClick={()=>setBalanceTooltip(balanceTooltip==='balance'?null:'balance')}>

                                    {(() => { const r = ingresosPeriodo - totalScope; return (<p className={`text-2xl font-bold mt-1 ${r >= 0 ? 'text-[#5dbd8c]' : 'text-rose-400'}`}>{formatoMoneda(r)}</p>); })()}

                                    <p className={`text-2xl font-bold mt-1 ${deltaPatrimonio >= 0 ? 'text-[#5dbd8c]' : 'text-rose-400'}`}>{formatoMoneda(deltaPatrimonio)}</p>
                                </div>
                            </>) : (<>
                                <div className="relative">
                                    <p className="text-[9px] text-zinc-600 uppercase cursor-pointer hover:text-white transition-colors inline-flex items-center gap-1" onClick={()=>setBalanceTooltip(balanceTooltip==='ingresoAcum'?null:'ingresoAcum')}>
                                        Ingreso Acum. <span className="text-[8px] text-zinc-700">{balanceTooltip==='ingresoAcum'?'▲':'▼'}</span>

                                    {balanceTooltip==='ingresoAcum' && (<div className="absolute top-full left-0 mt-1 w-52 bg-zinc-800 text-zinc-300 text-[8px] rounded p-2.5 border border-zinc-700 shadow-xl z-30 fade-in leading-relaxed">Todo el dinero que ha entrado desde el primer registro. Hogar: suma de ingresos no personales. Josué/Abi: solo los depositados en tus cuentas. Verde = entrada acumulada.</div>)}
                                    <p className="text-2xl font-bold text-[#5dbd8c] mt-1">{formatoMoneda(acumulados.ingresoAcum)}</p>
                                </div>
                                <div className="relative">
                                    <p className="text-[9px] text-zinc-600 uppercase cursor-pointer hover:text-white transition-colors inline-flex items-center gap-1" onClick={()=>setBalanceTooltip(balanceTooltip==='gastoAcum'?null:'gastoAcum')}>
                                        Gasto Acum. <span className="text-[8px] text-zinc-700">{balanceTooltip==='gastoAcum'?'▲':'▼'}</span>
                                    </p>
                                    {balanceTooltip==='gastoAcum' && (<div className="absolute top-full left-0 mt-1 w-52 bg-zinc-800 text-zinc-300 text-[8px] rounded p-2.5 border border-zinc-700 shadow-xl z-30 fade-in leading-relaxed">Suma de todos los gastos desde el primer registro. Hogar: gastos compartidos sin personales. Josué/Abi: tu parte de cada gasto. Rojo = salida acumulada.</div>)}
                                    <p className="text-2xl font-bold text-rose-400 mt-1">{formatoMoneda(acumulados.gastoAcum)}</p>
                                </div>
                                <div className="relative">
                                    <p className="text-[9px] text-zinc-600 uppercase cursor-pointer hover:text-white transition-colors inline-flex items-center gap-1" onClick={()=>setBalanceTooltip(balanceTooltip==='balanceAcum'?null:'balanceAcum')}>
                                        Balance Acum. <span className="text-[8px] text-zinc-700">{balanceTooltip==='balanceAcum'?'▲':'▼'}</span>
                                    </p>
                                    {balanceTooltip==='balanceAcum' && (<div className="absolute top-full left-0 mt-1 w-52 bg-zinc-800 text-zinc-300 text-[8px] rounded p-2.5 border border-zinc-700 shadow-xl z-30 fade-in leading-relaxed">Ingresos totales menos gastos totales. Tu ahorro neto histórico. Positivo = vives por debajo de tus ingresos. Negativo = has gastado más de lo que ha entrado. Verde = ahorro acumulado. Rojo = déficit acumulado.</div>)}
                                    {(() => { const r = acumulados.ingresoAcum - acumulados.gastoAcum; return (<p className={`text-2xl font-bold mt-1 ${r >= 0 ? 'text-[#5dbd8c]' : 'text-rose-400'}`}>{formatoMoneda(r)}</p>); })()}
                                </div>
                                <div className="relative">
                                    <p className="text-[9px] text-zinc-600 uppercase cursor-pointer hover:text-white transition-colors inline-flex items-center gap-1" onClick={()=>setBalanceTooltip(balanceTooltip==='patrimonio'?null:'patrimonio')}>
                                        Patrimonio <span className="text-[8px] text-zinc-700">{balanceTooltip==='patrimonio'?'▲':'▼'}</span>
                                    </p>
                                    {balanceTooltip==='patrimonio' && (<div className="absolute top-full left-0 mt-1 w-52 bg-zinc-800 text-zinc-300 text-[8px] rounded p-2.5 border border-zinc-700 shadow-xl z-30 fade-in leading-relaxed">Tu riqueza neta real acumulada. Suma el saldo actual de todas tus cuentas. Hogar: activos positivos menos deudas. Josué/Abi: saldo neto real de tus cuentas. Verde = positivo. Rojo = debes más de lo que tienes.</div>)}
                                    <p className={`text-2xl font-bold mt-1 ${balanceScope.patrimonio >= 0 ? 'text-[#5dbd8c]' : 'text-rose-400'}`}>{formatoMoneda(balanceScope.patrimonio)}</p>
                                </div>
                            </>)}
                        </div>
                        {/* ── Balance AJ row ── */}
                        <div className="border-t border-zinc-800/50 pt-3 mt-3">
                            <div className="flex items-center gap-2 relative">
                                <span className="text-[9px] text-zinc-600 uppercase font-bold tracking-wider cursor-pointer hover:text-white transition-colors" onClick={()=>setBalanceTooltip(balanceTooltip==='balanceAJ'?null:'balanceAJ')}>
                                    Balance AJ {balanceModo==='periodo'?'':'Acum.'} <span className="text-[8px] text-zinc-700">{balanceTooltip==='balanceAJ'?'▲':'▼'}</span>
                                </span>
                                {balanceTooltip==='balanceAJ' && (<div className="absolute top-full left-0 mt-1 w-56 bg-zinc-800 text-zinc-300 text-[8px] rounded p-2.5 border border-zinc-700 shadow-xl z-30 fade-in leading-relaxed">Balance entre Josu&eacute; y Abigail. Rastrea qui&eacute;n pag&oacute; cada gasto compartido y las transferencias entre ustedes. Positivo = Abi le debe a Josu&eacute;. Negativo = Josu&eacute; le debe a Abi. Rojo = t&uacute; debes. Verde = te deben.</div>)}
                                {(() => {
                                    const val = balanceModo === 'periodo' ? balanceAJ : balanceAJAcum;
                                    if (Math.abs(val) < 0.01) return (<span className="text-sm font-mono font-bold text-[#5dbd8c] flex items-center gap-1"><IconCheck /> Saldado</span>);
                                    if (viewScope === 'Compartido') return (<span className={`text-sm font-mono font-bold ${val > 0 ? 'text-white' : 'text-rose-400'}`}>{val > 0 ? '+' : ''}{formatoMoneda(val)}</span>);
                                    const soyDeudor = (viewScope === 'Josue' && val < 0) || (viewScope === 'Abi' && val > 0);
                                    return (<span className={`text-sm font-mono font-bold ${soyDeudor ? 'text-rose-400' : 'text-[#5dbd8c]'}`}>{formatoMoneda(Math.abs(val))}</span>);
                                })()}
                            </div>
                        </div>
                    </div>

                    {/* ── Card 2: Daily Summary ── */}
                    <div className="glass-card p-5">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 mb-3">
                            <p className="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Resumen Diario</p>
                            <button onClick={()=>{setDailyModo(dailyModo==='gasto'?'balance':'gasto');setDailyTooltip(null)}} className="flex items-center gap-0 bg-zinc-900 border border-zinc-800 rounded-full p-0.5 transition-colors hover:border-zinc-700" title={dailyModo==='gasto'?'Cambiar a vista Balance':'Cambiar a vista Gasto'}>
                                <span className={`px-2.5 py-1 rounded-full text-[9px] font-bold uppercase transition-all flex items-center gap-1 ${dailyModo==='gasto'?'bg-[#5dbd8c] text-black':'text-zinc-500'}`}>Gasto</span>
                                <span className={`px-2.5 py-1 rounded-full text-[9px] font-bold uppercase transition-all flex items-center gap-1 ${dailyModo==='balance'?'bg-[#5dbd8c] text-black':'text-zinc-500'}`}>Balance</span>
                            </button>
                        </div>
                        <div className="grid grid-cols-3 gap-4">
                            {dailyModo === 'gasto' ? (<>
                                <div className="relative">
                                    <p className="text-[9px] text-zinc-600 uppercase cursor-pointer hover:text-white transition-colors inline-flex items-center gap-1" onClick={()=>setDailyTooltip(dailyTooltip==='hoyG'?null:'hoyG')}>
                                        Gasto Hoy <span className="text-[8px] text-zinc-700">{dailyTooltip==='hoyG'?'▲':'▼'}</span>
                                    </p>
                                    {dailyTooltip==='hoyG' && (<div className="absolute top-full left-0 mt-1 w-48 bg-zinc-800 text-zinc-300 text-[8px] rounded p-2.5 border border-zinc-700 shadow-xl z-30 fade-in leading-relaxed">Total de gastos registrados hoy. ¿Cuánto llevas gastado en el día? Rojo = salida de dinero.</div>)}
                                    <p className="text-xl font-bold text-rose-400 mt-1">{formatoMoneda(dailySummary.todayGasto)}</p>
                                </div>
                                <div className="relative">
                                    <p className="text-[9px] text-zinc-600 uppercase cursor-pointer hover:text-white transition-colors inline-flex items-center gap-1" onClick={()=>setDailyTooltip(dailyTooltip==='prom7G'?null:'prom7G')}>
                                        Prom. 7d <span className="text-[8px] text-zinc-700">{dailyTooltip==='prom7G'?'▲':'▼'}</span>

                                    {dailyTooltip==='prom7G' && (<div className="absolute top-full left-0 mt-1 w-48 bg-zinc-800 text-zinc-300 text-[8px] rounded p-2.5 border border-zinc-700 shadow-xl z-30 fade-in leading-relaxed">Gasto promedio diario de la última semana. Compáralo con el de 30d. Rojo = estás acelerando el gasto. Verde = vas frenando.</div>)}
                                    {(() => { const v7 = dailySummary.avg7Gasto, v30 = dailySummary.avg30Gasto; const c = v30 > 0 && v7 > v30 ? 'text-rose-400' : 'text-[#5dbd8c]'; return (<p className={`text-xl font-bold mt-1 ${c}`}>{formatoMoneda(v7)}</p>); })()}

                                                        <button onClick={e => { e.stopPropagation(); onAdd && onAdd({ tipoOperacion: 'Transferencia', cuentaDestino: tdc.nombre, compra: 'Pago ' + tdc.nombre }); }} title="Pagar esta tarjeta" className="text-zinc-600 hover:text-[#5dbd8c] transition-colors ml-1">
                                                            <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                                                        </button>
                                                    </div>
                                                    <div className="flex items-center gap-1">
                                                        <span className="text-[10px] font-mono font-bold text-rose-400">{formatoMoneda(tdc.saldoPendiente)}</span>

                                                <div className="relative h-3 rounded-full overflow-hidden border border-zinc-800 mb-1 bar-track">

                                                        <div className="absolute top-0 h-full bg-[#1a3a28] transition-all duration-500" style={{left:`${Math.min(pctPagado, 100)}%`, width:`${Math.min(pctDebe, 100-pctPagado)}%`, zIndex:1}}></div>

                                                    <div className="absolute top-0 h-full w-0.5 bg-white/80 z-10" style={{left:`${tdc.cicloPct}%`}}>
                                                        <div className="absolute -top-4 left-1/2 -translate-x-1/2 text-[7px] text-zinc-500 cursor-pointer hover:text-white transition-colors" onClick={e => { e.stopPropagation(); setTtCorte(ttCorte === 'ciclo_'+tdc.nombre ? null : 'ciclo_'+tdc.nombre); }}>●</div>
                                                        {ttCorte === 'ciclo_'+tdc.nombre && (<span className="absolute -top-16 left-1/2 -translate-x-1/2 w-36 bg-zinc-800 text-zinc-300 text-[7px] rounded p-2 border border-zinc-700 shadow-lg z-20 fade-in text-center">Día {diaHoy} del ciclo · {Math.round(tdc.cicloPct)}% transcurrido</span>)}

                                                    <span className="flex items-center gap-1">
                                                        <svg className="w-3 h-3 inline" viewBox="0 0 24 24" fill="none" stroke="#5DBD8C" strokeWidth="2" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                                        <span className="cursor-pointer hover:text-white transition-colors relative" onClick={e => { e.stopPropagation(); setTtCorte(ttCorte === tdc.nombre ? null : tdc.nombre); }}>Corte {tdc.corte}
                                                            {ttCorte === tdc.nombre && (<span className="absolute bottom-full left-0 mb-1 w-40 bg-zinc-800 text-zinc-300 text-[7px] rounded p-2 border border-zinc-700 shadow-lg z-20 fade-in">Día en que el banco cierra tu estado de cuenta.</span>)}
                                                        </span>
                                                    </span>
                                                    <span className="text-[#3b82f6]/70">{tdc.diasHastaVence > 0 ? `Faltan ${tdc.diasHastaVence} d` : 'Hoy vence'}</span>
                                                    <span className="flex items-center gap-1 text-right">
                                                        <span className="cursor-pointer hover:text-white transition-colors relative" onClick={e => { e.stopPropagation(); setTtVence(ttVence === tdc.nombre ? null : tdc.nombre); }}>Vence {tdc.vencimiento}
                                                            {ttVence === tdc.nombre && (<span className="absolute bottom-full right-0 mb-1 w-40 bg-zinc-800 text-zinc-300 text-[7px] rounded p-2 border border-zinc-700 shadow-lg z-20 fade-in">Fecha límite para pagar sin generar intereses.</span>)}
                                                        </span>
                                                        <svg className="w-3 h-3 inline" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" strokeWidth="2" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                                    </span>

                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* ── Tendencia Patrimonio ── */}
                    <div className={`glass-card p-5 transition-all duration-300 ${trendExpanded ? 'ring-1 ring-[#5dbd8c]/30' : ''}`}>

                            <div className="flex gap-2">

                                    <span className="w-2 h-2 rounded-full" style={{backgroundColor:'#22c55e'}}></span>Activos
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); setShowTrendPasivo(!showTrendPasivo); }} className={`px-3 py-1 text-[9px] font-bold uppercase rounded-full border transition-all flex items-center gap-1.5 ${showTrendPasivo ? 'bg-[#ef4444]/15 border-[#ef4444]/50 text-[#ef4444]' : 'border-zinc-800 text-zinc-600'}`}>
                                    <span className="w-2 h-2 rounded-full" style={{backgroundColor:'#ef4444'}}></span>Pasivos
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); setShowTrendPatrimonio(!showTrendPatrimonio); }} className={`px-3 py-1 text-[9px] font-bold uppercase rounded-full border transition-all flex items-center gap-1.5 ${showTrendPatrimonio ? 'bg-[#3b82f6]/15 border-[#3b82f6]/50 text-[#3b82f6]' : 'border-zinc-800 text-zinc-600'}`}>
                                    <span className="w-2 h-2 rounded-full" style={{backgroundColor:"#3b82f6"}}></span>Patrimonio
                                </button>
                            </div>
                        </div>

                        {trendExpanded && (
                            <div className="mb-4 p-4 bg-zinc-900/50 rounded border border-zinc-800 grid grid-cols-2 gap-4 fade-in">
                                <div>
                                    <label className="text-[9px] uppercase text-zinc-500 block mb-1 font-bold">Meses Históricos</label>
                                    <select className="w-full p-2 text-xs rounded bg-black outline-none border border-zinc-800 font-bold text-white" value={trendMonths} onChange={e => setTrendMonths(Number(e.target.value))}>
                                        <option value={3}>3 meses</option>
                                        <option value={6}>6 meses</option>
                                        <option value={12}>12 meses</option>
                                        <option value={18}>18 meses</option>
                                        <option value={24}>24 meses</option>
                                    </select>
                                </div>
                                <div className="col-span-full grid grid-cols-3 gap-2 text-center text-[9px]">
                                    {(() => {
                                        const last = patrimonioData.slice(-1)[0] || {};
                                        return (<>
                                            <div className="bg-[#22c55e]/10 border border-[#22c55e]/30 rounded p-2">
                                                <span className="text-zinc-500 block text-[8px] uppercase">Activos</span>
                                                <span className="text-[#22c55e] font-bold">{formatoMoneda(last.activo || 0)}</span>
                                            </div>
                                            <div className="bg-[#ef4444]/10 border border-[#ef4444]/30 rounded p-2">
                                                <span className="text-zinc-500 block text-[8px] uppercase">Pasivos</span>
                                                <span className="text-[#ef4444] font-bold">{formatoMoneda(last.pasivo || 0)}</span>
                                            </div>
                                            <div className="bg-[#5dbd8c]/10 border border-[#5dbd8c]/30 rounded p-2">
                                                <span className="text-zinc-500 block text-[8px] uppercase">Patrimonio</span>
                                                <span className="text-[#5dbd8c] font-bold">{formatoMoneda(last.patrimonio || 0)}</span>
                                            </div>
                                        </>);
                                    })()}
                                </div>
                            </div>
                        )}

                        {patrimonioData.length === 0 ? (
                            <p className="text-zinc-600 text-xs text-center py-8">Sin datos</p>
                        ) : (() => {
                            const anyVisible = showTrendActivo || showTrendPasivo || showTrendPatrimonio;
                            if (!anyVisible) return <p className="text-zinc-500 text-xs text-center py-8">Selecciona al menos una serie ↑</p>;
                            const maxActivo = showTrendActivo ? Math.max(...patrimonioData.map(d=>d.activo), 1) : 0;
                            const maxPasivo = showTrendPasivo ? Math.max(...patrimonioData.map(d=>d.pasivo), 1) : 0;
                            const maxPat = showTrendPatrimonio ? Math.max(...patrimonioData.map(d=>Math.abs(d.patrimonio)), 1) : 0;
                            const minPat = showTrendPatrimonio ? Math.abs(Math.min(...patrimonioData.map(d=>d.patrimonio), 0)) : 0;
                            const niceMax = Math.ceil(Math.max(maxActivo, maxPat) / 1000) * 1000 || 1000;
                            const niceMin = -Math.ceil(Math.max(maxPasivo, minPat) / 1000) * 1000;
                            const yRange = niceMax - niceMin;
                            const H = trendExpanded ? 280 : 180, W_OFF = 55, W_RIGHT = 20, BOT = 28, TOP = 12;
                            const chartH = H + BOT + TOP;
                            const gap = trendExpanded ? 65 : Math.max(35, 850 / patrimonioData.length);
                            const totalW = W_OFF + patrimonioData.length * gap + W_RIGHT;
                            const yScale = (v) => TOP + ((niceMax - v) / yRange) * H;
                            const zeroY = yScale(0);
                            const tickCount = 4;
                            const yTicks = Array.from({length: tickCount + 1}, (_, i) => niceMin + (yRange / tickCount) * i);
                            return (
                                <div className="overflow-x-auto" onClick={() => { if (!trendExpanded) setTrendExpanded(true); }} style={{cursor: trendExpanded ? "default" : "pointer", background:"#0a0a0a", borderRadius:"6px", padding:"6px"}}>
                                    <svg viewBox={`0 0 ${totalW} ${chartH}`} className="w-full" style={{minWidth:'480px',height:'auto'}}>
                                        <defs>
                                            <linearGradient id="gradActP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#22c55e" stopOpacity="0.2"/><stop offset="100%" stopColor="#22c55e" stopOpacity="0.02"/></linearGradient>
                                            <linearGradient id="gradPasP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#ef4444" stopOpacity="0.02"/><stop offset="100%" stopColor="#ef4444" stopOpacity="0.15"/></linearGradient>
                                        </defs>
                                        {yTicks.map((t,i) => (<g key={i}><line x1={W_OFF} y1={yScale(t)} x2={W_OFF+patrimonioData.length*gap-5} y2={yScale(t)} stroke={t===0?'#333':'#1f1f1f'} strokeWidth={t===0?'1.5':'1'} strokeDasharray={t===0?'':'4 4'}/><text x={W_OFF-8} y={yScale(t)+4} textAnchor="end" className="text-[8px] fill-zinc-600" style={{fontFamily:'JetBrains Mono,monospace'}}>{t>=0?'$'+Math.round(t/1000)+'k':'-$'+Math.round(Math.abs(t)/1000)+'k'}</text></g>))}
                                        <line x1={W_OFF} y1={zeroY} x2={W_OFF+patrimonioData.length*gap-5} y2={zeroY} stroke="#333" strokeWidth="1.5"/>
                                        {patrimonioData.map((d,i) => <text key={'lbl'+i} x={W_OFF+i*gap} y={TOP+H+16} textAnchor="middle" className="text-[8px] fill-zinc-500" style={{fontFamily:'JetBrains Mono,monospace'}}>{d.label}</text>)}
                                        {showTrendActivo && (() => { const pts=patrimonioData.map((d,i)=>`${W_OFF+i*gap},${yScale(d.activo)}`).join(' '); const fx=W_OFF,lx=W_OFF+(patrimonioData.length-1)*gap; return (<g><polygon points={`${fx},${zeroY} ${pts} ${lx},${zeroY}`} fill="url(#gradActP)"/><polyline points={pts} fill="none" stroke="#22c55e" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.95"/>{patrimonioData.map((d,i)=><circle key={'a'+i} cx={W_OFF+i*gap} cy={yScale(d.activo)} r={trendExpanded?5:4} fill="#22c55e" stroke="#050505" strokeWidth="2"><title>Activos {d.label}: {formatoMoneda(d.activo)}</title></circle>)}</g>);})()}
                                        {showTrendPasivo && (() => { const pts=patrimonioData.map((d,i)=>`${W_OFF+i*gap},${yScale(-d.pasivo)}`).join(' '); const fx=W_OFF,lx=W_OFF+(patrimonioData.length-1)*gap; return (<g><polygon points={`${fx},${zeroY} ${pts} ${lx},${zeroY}`} fill="url(#gradPasP)"/><polyline points={pts} fill="none" stroke="#ef4444" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.95"/>{patrimonioData.map((d,i)=><circle key={'p'+i} cx={W_OFF+i*gap} cy={yScale(-d.pasivo)} r={trendExpanded?5:4} fill="#ef4444" stroke="#050505" strokeWidth="2"><title>Pasivos {d.label}: {formatoMoneda(d.pasivo)}</title></circle>)}</g>);})()}
                                        {showTrendPatrimonio && (() => { const pts=patrimonioData.map((d,i)=>`${W_OFF+i*gap},${yScale(d.patrimonio)}`).join(' '); const fx=W_OFF,lx=W_OFF+(patrimonioData.length-1)*gap; return (<g><polygon points={`${fx},${zeroY} ${pts} ${lx},${zeroY}`} fill="#3b82f6" opacity="0.08"/><polyline points={pts} fill="none" stroke="#3b82f6" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" opacity="0.95"/>{patrimonioData.map((d,i)=><circle key={'n'+i} cx={W_OFF+i*gap} cy={yScale(d.patrimonio)} r={trendExpanded?5:4} fill="#3b82f6" stroke="#050505" strokeWidth="2"><title>Patrimonio {d.label}: {formatoMoneda(d.patrimonio)}</title></circle>)}</g>);})()}
                                        {trendExpanded && (() => { const all=[]; patrimonioData.forEach((d,i)=>{ const x=W_OFF+i*gap; if(showTrendActivo)all.push({x,y:yScale(d.activo),val:d.activo,color:'#22c55e',key:'a'+i}); if(showTrendPasivo)all.push({x,y:yScale(-d.pasivo),val:d.pasivo,color:'#ef4444',key:'p'+i}); if(showTrendPatrimonio)all.push({x,y:yScale(d.patrimonio),val:d.patrimonio,color:"#3b82f6",key:'n'+i}); }); const gr={}; all.forEach(l=>{if(!gr[l.x])gr[l.x]=[];gr[l.x].push(l);}); const pos=[]; Object.values(gr).forEach(g=>{ g.sort((a,b)=>a.y-b.y); let pb=-Infinity; g.forEach(l=>{ let ly=l.y-12; if(ly<TOP+8)ly=l.y+14; if(ly-8<pb)ly=pb+13; if(ly>TOP+H-2)ly=l.y-12; pb=ly+8; pos.push({...l,labelY:ly}); }); }); return pos.map(pl=>(<text key={'vl'+pl.key} x={pl.x} y={pl.labelY} textAnchor="middle" className="text-[8px] font-bold" fill={pl.color} style={{fontFamily:'JetBrains Mono,monospace',paintOrder:'stroke',stroke:'#050505',strokeWidth:'3px',strokeLinecap:'round',strokeLinejoin:'round'}}>{pl.val>=1000?'$'+Math.round(pl.val/1000)+'k':'$'+Math.round(pl.val)}</text>)); })()}
                                    </svg>
                                    {!trendExpanded && <p className="text-[8px] text-zinc-600 text-center mt-2">Click para expandir</p>}
                                </div>
                            );
                        })()}
                    </div>


                </div>
            );
        });

        // === PANTALLA DE LOGIN ===
        const LoginScreen = ({ onLogin }) => {
            const [user, setUser] = useState(localStorage.getItem('fl_lastuser') || '');
            const [pw, setPw] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [forgotView, setForgotView] = useState(false);
            const [recoveryUser, setRecoveryUser] = useState('');
            const [recoveryAnswer, setRecoveryAnswer] = useState('');
            const [recoveryNewPw, setRecoveryNewPw] = useState('');
            const [recoveryStep, setRecoveryStep] = useState(0); // 0=q shown, 1=set new pw
            const [recoveryQ, setRecoveryQ] = useState('');
            
            const handleLogin = async (e) => {
                e.preventDefault();
                if (!user) { setError('Selecciona tu usuario'); return; }
                setLoading(true); setError('');
                const users = USERS();
                const u = users[user];
                if (!u) { setError('Usuario no encontrado'); setLoading(false); return; }
                let valid = false;
                if (crypto.subtle) {
                    const hash = await sha256hex(pw);
                    valid = (hash === u.hash);
                } else {
                    // Test env (HTTP): plaintext comparison
                    valid = (pw === '3113' && user === 'josue') || (pw === '1309' && user === 'abi');
                }
                if (valid) {
                    localStorage.setItem('fl_auth', '1');
                    localStorage.setItem('fl_user', user);
                    localStorage.setItem('fl_lastuser', user);
                    onLogin(user);
                } else {
                    setError('Contraseña incorrecta');
                    setLoading(false);
                }
            };

            const startRecovery = (usr) => {
                const users = USERS();
                const u = users[usr];
                if (!u) { setError('Usuario no encontrado'); return; }
                setRecoveryUser(usr);
                setRecoveryQ(u.pregunta || 'Pregunta de seguridad');
                setRecoveryStep(0);
                setForgotView(true);
                setError('');
            };

            const verifyRecovery = async () => {
                const users = USERS();
                const u = users[recoveryUser];
                let valid = false;
                if (crypto.subtle) {
                    const ansHash = await sha256hex(recoveryAnswer.toLowerCase().trim());
                    valid = (ansHash === u.respuesta);
                } else {
                    valid = (recoveryAnswer.toLowerCase().trim() === 'cdmx');
                }
                if (valid) {
                    setRecoveryStep(1);
                    setError('');
                } else {
                    setError('Respuesta incorrecta');
                }
            };

            const saveNewPassword = async () => {
                if (recoveryNewPw.length < 3) { setError('Mínimo 3 caracteres'); return; }
                const users = USERS();
                if (crypto.subtle) {
                    users[recoveryUser].hash = await sha256hex(recoveryNewPw);
                } else {
                    // Test env: store plaintext
                    users[recoveryUser].hash = 'test_' + recoveryNewPw;
                }
                saveUsers(users);
                setForgotView(false);
                setRecoveryStep(0);
                setError('');
                alert('Contraseña actualizada. Ya puedes iniciar sesión.');
            };

            if (forgotView) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="glass-card p-6 max-w-sm w-full fade-in">
                            <h2 className="text-sm font-black uppercase text-[#5dbd8c] mb-4"><IconLock /> Recuperar acceso</h2>
                            {recoveryStep === 0 ? (
                                <div className="space-y-4">
                                    <p className="text-[11px] text-zinc-400">Usuario: <b className="text-white">{recoveryUser}</b></p>
                                    <p className="text-[11px] text-zinc-500">{recoveryQ}</p>
                                    <input className="w-full p-3 rounded font-mono text-sm outline-none" placeholder="Tu respuesta..." value={recoveryAnswer} onChange={e=>setRecoveryAnswer(e.target.value)} onKeyDown={e=>e.key==='Enter'&&verifyRecovery()} autoFocus />
                                    {error && <div className="bg-rose-500/20 text-rose-400 border border-rose-500 p-2 rounded text-xs text-center">{error}</div>}
                                    <button onClick={verifyRecovery} className="w-full bg-[#3d8068] text-black font-black p-3 rounded uppercase text-xs">Verificar</button>
                                    <button onClick={()=>setForgotView(false)} className="w-full text-zinc-500 text-[10px] hover:text-white">← Volver</button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <p className="text-[11px] text-[#5dbd8c]"><IconCheck /> Identidad verificada</p>
                                    <label className="text-[10px] text-zinc-500 uppercase block font-bold">Nueva contraseña</label>
                                    <input type="password" className="w-full p-3 rounded font-mono text-sm outline-none" placeholder="Mín. 3 caracteres" value={recoveryNewPw} onChange={e=>setRecoveryNewPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveNewPassword()} autoFocus />
                                    {error && <div className="bg-rose-500/20 text-rose-400 border border-rose-500 p-2 rounded text-xs text-center">{error}</div>}
                                    <button onClick={saveNewPassword} className="w-full bg-[#3d8068] text-black font-black p-3 rounded uppercase text-xs">Guardar nueva contraseña</button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="glass-card p-6 max-w-sm w-full fade-in">
                        <div className="text-center mb-5">
                            <h1 className="text-2xl font-black uppercase tracking-tighter">Finance<span className="text-[#3d8068]">Lab</span></h1>
                            <p className="text-[10px] text-zinc-500 mt-1 tracking-[0.2em]">HOGAR JOSUÉ & ABIGAIL</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-3">
                            <div>
                                <label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Usuario</label>
                                <div className="flex gap-2">
                                    {['josue','abi'].map(u => (
                                        <button key={u} type="button" onClick={()=>setUser(u)} className={`flex-1 p-3 rounded font-bold uppercase text-xs transition-all ${user===u ? 'bg-[#3d8068] text-black' : 'bg-zinc-900 text-zinc-500 border border-zinc-800 hover:border-[#3d8068]'}`}>{u}</button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="text-[10px] text-zinc-500 uppercase block mb-1 font-bold">Contraseña</label>
                                <input type="password" className="w-full p-3 rounded font-mono text-lg text-white outline-none" placeholder="••••••" value={pw} onChange={e=>setPw(e.target.value)} autoFocus />
                            </div>
                            {error && <div className="bg-rose-500/20 text-rose-400 border border-rose-500 p-2 rounded text-xs font-bold text-center">{error}</div>}
                            <button type="submit" disabled={loading} className="w-full bg-[#3d8068] text-black font-black p-3 rounded uppercase tracking-[0.2em] text-xs hover:bg-white transition-all">
                                {loading ? 'Verificando...' : 'Entrar'}
                            </button>
                        </form>
                        <div className="mt-3 text-center">
                            <button onClick={() => { const u = user || 'josue'; startRecovery(u); }} className="text-[10px] text-zinc-600 hover:text-[#5dbd8c] transition-colors">¿Olvidaste tu contraseña?</button>
                        </div>
                        <p className="text-[9px] text-zinc-600 text-center mt-3">ollincan.com/financelab</p>
                    </div>
                </div>
            );
        };

        const IconCalc = () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>;

        // ── CALCULADORA POPUP ──
        const CalcPopup = ({ onResult, onClose }) => {
            const [expr, setExpr] = useState('0');
            const [resetOnNext, setReset] = useState(true);
            
            const press = (key) => {
                if (key === 'AC') { setExpr('0'); setReset(true); return; }
                if (key === '=') {
                    try {
                        const result = Function('"use strict"; return (' + expr + ')')();
                        if (!isNaN(result) && isFinite(result)) {
                            setExpr(String(Number(result.toFixed(2))));
                            setReset(true);
                        }
                    } catch {}
                    return;
                }
                let next;
                if (resetOnNext && /[0-9(]/.test(key)) {
                    next = key;
                    setReset(false);
                } else if (resetOnNext && key === '.') {
                    next = '0.';
                    setReset(false);
                } else {
                    next = (resetOnNext ? '' : expr) + key;
                    setReset(false);
                }
                // Validate: don't allow consecutive operators
                if (/[+\-*/.]{2,}$/.test(next)) return;
                // Don't allow operator at start except minus
                if (/^[+*/.]/.test(next)) return;
                setExpr(next);
            };
            
            const displayValue = (() => {
                try {
                    const r = Function('"use strict"; return (' + expr + ')')();
                    if (!isNaN(r) && isFinite(r) && expr.length > 2) return Number(r).toLocaleString('es-MX', {maximumFractionDigits: 10});
                } catch {}
                return expr;
            })();

            const keys = [
                ['AC','⌫','()','÷'],
                ['7','8','9','×'],
                ['4','5','6','−'],
                ['1','2','3','+'],
                ['0','.','=']
            ];
            
            const handleKey = (k) => {
                if (k === 'AC') press('AC');
                else if (k === '⌫') {
                    const next = expr.length > 1 ? expr.slice(0, -1) : '0';
                    setExpr(next);
                    setReset(next === '0');
                }
                else if (k === '()') {
                    const open = (expr.match(/\(/g)||[]).length;
                    const close = (expr.match(/\)/g)||[]).length;
                    press(open > close ? ')' : '(');
                }
                else if (k === '%' || k === '÷') press('/');
                else if (k === '×') press('*');
                else if (k === '−') press('-');
                else press(k);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 fade-in px-2" onClick={onClose}>
                    <div className="glass-card w-full max-w-xs" onClick={e => e.stopPropagation()} style={{maxWidth:'320px'}}>
                        <div className="bg-black rounded-t p-4 text-right border-b border-zinc-800">
                            <div className="text-[10px] text-zinc-600 font-mono h-4 overflow-hidden truncate">{expr === '0' ? ' ' : expr}</div>
                            <div className="text-2xl font-mono text-white font-bold truncate tracking-tight">{displayValue}</div>
                        </div>
                        <div className="p-2 grid gap-1.5" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
                            {keys.flat().map(k => {
                                if (k === '0') return (
                                    <button key={k} onClick={() => handleKey(k)} className="col-span-1 p-4 rounded font-mono font-bold text-base bg-zinc-900 text-white hover:bg-zinc-800 active:bg-zinc-700 transition-colors">{k}</button>
                                );
                                if (k === '=') return (
                                    <button key={k} onClick={() => handleKey(k)} className="col-span-1 p-4 rounded font-mono font-black text-base bg-[#3d8068] text-black hover:bg-[#5dbd8c] active:bg-[#9ad9bc] transition-colors">{k}</button>
                                );
                                const isOp = ['÷','×','−','+','%','()'].includes(k);
                                const isFn = ['AC','⌫'].includes(k);
                                return (
                                    <button key={k} onClick={() => handleKey(k)} className={`col-span-1 p-4 rounded font-mono font-bold text-base transition-colors active:scale-95 ${
                                        isFn ? 'bg-rose-500/20 text-rose-400 hover:bg-rose-500/30' :
                                        isOp ? 'bg-zinc-800 text-[#5dbd8c] hover:bg-zinc-700' :
                                        'bg-zinc-900 text-white hover:bg-zinc-800'
                                    }`}>{k}</button>
                                );
                            })}
                        </div>
                        <div className="px-2 pb-2 flex gap-2">
                            <button onClick={() => { try { const r = Function('"use strict"; return (' + expr + ')')(); if (!isNaN(r) && isFinite(r)) onResult(Number(Number(r).toFixed(2))); } catch {} }} className="flex-1 bg-[#3d8068] text-black font-black p-3 rounded text-xs uppercase tracking-wider hover:bg-[#5dbd8c] transition-colors">Usar ${displayValue !== expr ? displayValue : expr}</button>
                            <button onClick={onClose} className="px-4 rounded bg-zinc-900 text-zinc-500 text-xs hover:text-white hover:bg-zinc-800 transition-colors"><IconClose /></button>
                        </div>
                    </div>
                </div>
            );
        };

        // ── CALENDAR VIEW (Bluecoins style) ──
        const CalendarView = React.memo(({ logs, cuentas }) => {
            const hoy = new Date();
            const [calYear, setCalYear] = useState(hoy.getFullYear());
            const [calMonth, setCalMonth] = useState(hoy.getMonth());
            const [selectedDay, setSelectedDay] = useState(null);
            
            const goPrev = () => { if(calMonth===0){ setCalYear(y=>y-1); setCalMonth(11); }else{ setCalMonth(m=>m-1); } setSelectedDay(null); };
            const goNext = () => { if(calMonth===11){ setCalYear(y=>y+1); setCalMonth(0); }else{ setCalMonth(m=>m+1); } setSelectedDay(null); };
            
            const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            const diasSemana = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
            
            // Build days matrix
            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const daysInPrev = new Date(calYear, calMonth, 0).getDate();
            
            const calendarDays = [];
            // Previous month fill
            for (let i = firstDay - 1; i >= 0; i--) {
                calendarDays.push({ day: daysInPrev - i, month: 'prev', date: new Date(calYear, calMonth - 1, daysInPrev - i) });
            }
            // Current month
            for (let d = 1; d <= daysInMonth; d++) {
                calendarDays.push({ day: d, month: 'current', date: new Date(calYear, calMonth, d), isToday: d === hoy.getDate() && calMonth === hoy.getMonth() && calYear === hoy.getFullYear() });
            }
            // Next month fill
            const remaining = 42 - calendarDays.length;
            for (let d = 1; d <= remaining; d++) {
                calendarDays.push({ day: d, month: 'next', date: new Date(calYear, calMonth + 1, d) });
            }
            
            // Transactions per day
            const txByDay = useMemo(() => {
                const map = {};
                logs.forEach(l => {
                    const [d,m,y] = (l.Fecha_Compra||'').split('/');
                    if(!d) return;
                    const key = `${y}-${m}-${d}`;
                    if(!map[key]) map[key] = { gastos: 0, ingresos: 0, count: 0, items: [] };
                    const amt = Number(l.Monto_Parcial) || 0;
                    if(l.Tipo_Operacion === 'Ingreso') map[key].ingresos += amt;
                    else if(l.Tipo_Operacion === 'Gasto') map[key].gastos += amt;
                    map[key].count++;
                    map[key].items.push(l);
                });
                return map;
            }, [logs]);
            
            const getDayKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            
            const selectedData = selectedDay ? txByDay[getDayKey(selectedDay)] : null;
            const selectedDateStr = selectedDay ? selectedDay.toLocaleDateString('es-MX', {weekday:'long',day:'numeric',month:'long',year:'numeric'}) : '';
            
            return (
                <div className="space-y-4 fade-in">
                    {/* Month header */}
                    <div className="glass-card p-4 flex items-center justify-between">
                        <button onClick={goPrev} className="p-2 rounded hover:bg-zinc-800 text-zinc-400 hover:text-white transition-colors"><IconChevronLeft /></button>
                        <h2 className="text-sm font-black uppercase tracking-widest text-[#5dbd8c]">{meses[calMonth]} {calYear}</h2>
                        <button onClick={goNext} className="p-2 rounded hover:bg-zinc-800 text-zinc-400 hover:text-white transition-colors" style={{transform:'rotate(180deg)'}}><IconChevronLeft /></button>
                    </div>
                    
                    {/* Calendar grid */}
                    <div className="glass-card overflow-hidden">
                        <div className="grid grid-cols-7">
                            {diasSemana.map(d => <div key={d} className="p-2 text-center text-[9px] font-bold uppercase text-zinc-500 bg-zinc-900/50 border-b border-zinc-800">{d}</div>)}
                        </div>
                        <div className="grid grid-cols-7">
                            {calendarDays.map((cd, i) => {
                                const key = getDayKey(cd.date);
                                const dayData = txByDay[key];
                                const isSelected = selectedDay && getDayKey(selectedDay) === key;
                                return (
                                    <div key={i}
                                        onClick={() => cd.month === 'current' && setSelectedDay(cd.date)}
                                        className={`p-1.5 md:p-2 text-center border-b border-r border-zinc-800/50 cursor-pointer transition-colors min-h-[48px] md:min-h-[60px] flex flex-col items-center
                                            ${cd.month !== 'current' ? 'bg-zinc-900/30 text-zinc-700' : 'hover:bg-zinc-900'}
                                            ${isSelected ? 'bg-[#3d8068]/20 ring-1 ring-[#3d8068]' : ''}`}
                                        style={{borderRightWidth: (i+1)%7===0?'0':'1px'}}
                                    >
                                        <span className={`text-[10px] md:text-xs font-mono font-bold mb-0.5 w-6 h-6 flex items-center justify-center rounded-full
                                            ${cd.isToday ? 'bg-[#5dbd8c] text-black' : cd.month==='current' ? 'text-zinc-300' : 'text-zinc-700'}`}>{cd.day}</span>
                                        {dayData && cd.month === 'current' && (
                                            <div className="flex gap-0.5 flex-wrap justify-center">
                                                {dayData.gastos > 0 && <span className="w-1.5 h-1.5 rounded-full bg-rose-500/70" title={`Gastos: ${formatoMoneda(dayData.gastos)}`}></span>}
                                                {dayData.ingresos > 0 && <span className="w-1.5 h-1.5 rounded-full bg-[#5dbd8c]/70" title={`Ingresos: ${formatoMoneda(dayData.ingresos)}`}></span>}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                    
                    {/* Selected day transactions */}
                    {selectedData && (
                        <div className="glass-card p-4 fade-in">
                            <h3 className="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-3 capitalize">{selectedDateStr}</h3>
                            <div className="grid grid-cols-2 gap-4 mb-4">
                                {selectedData.gastos > 0 && <div className="bg-zinc-900/50 p-3 rounded border border-zinc-800"><p className="text-[9px] text-zinc-500 uppercase">Gastos</p><p className="text-lg font-bold text-rose-400">{formatoMoneda(selectedData.gastos)}</p></div>}
                                {selectedData.ingresos > 0 && <div className="bg-zinc-900/50 p-3 rounded border border-zinc-800"><p className="text-[9px] text-zinc-500 uppercase">Ingresos</p><p className="text-lg font-bold text-[#5dbd8c]">{formatoMoneda(selectedData.ingresos)}</p></div>}
                            </div>
                            <div className="space-y-2">
                                {selectedData.items.map((l, i) => (
                                    <div key={i} className="flex justify-between items-center p-2 bg-zinc-900/30 rounded border border-zinc-800/50 text-[11px]">
                                        <div className="flex items-center gap-2">
                                            <span className={`w-2 h-2 rounded-full ${l.Tipo_Operacion === 'Ingreso' ? 'bg-[#5dbd8c]' : l.Tipo_Operacion === 'Transferencia' ? 'bg-indigo-500' : 'bg-rose-500'}`}></span>
                                            <span className="text-zinc-300">{l.Compra}</span>
                                            <span className="text-[8px] text-zinc-600 uppercase">{l.Categoria}</span>
                                        </div>
